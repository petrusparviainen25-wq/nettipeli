<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hockey Safe Shoot Fix</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:20px;
}
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD (UNCHANGED)
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.9));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE (UNCHANGED)
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL (UNCHANGED)
/////////////////////////////////////////////////////

function makeGoal(){

  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0xff0000});

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.4,8,0.4),mat);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.4,8,0.4),mat);
  const top = new THREE.Mesh(new THREE.BoxGeometry(12,0.4,0.4),mat);

  left.position.set(-6,4,-40);
  right.position.set(6,4,-40);
  top.position.set(0,8,-40);

  g.add(left,right,top);
  scene.add(g);
}
makeGoal();

/////////////////////////////////////////////////////
// 🥅 GOALIE (UNCHANGED)
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PLAYERS (UNCHANGED)
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);
const ai = player(0xff3333,-35);
const defender = player(0xff7777,-20);

/////////////////////////////////////////////////////
// 🧊 PUCK (UNCHANGED)
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🧠 STATE (UNCHANGED)
/////////////////////////////////////////////////////

let owner = "free";
let vx = 0;
let vz = 0;
let vy = 0;

let controlled = "user";
let lock = false;

let mouse = {x:0,y:0};

/////////////////////////////////////////////////////
// 🎮 INPUT (UNCHANGED)
/////////////////////////////////////////////////////

addEventListener("mousemove",e=>{
  mouse.x = (e.clientX/innerWidth - 0.5)*2;
  mouse.y = (e.clientY/innerHeight - 0.5)*2;
});

/////////////////////////////////////////////////////
// 🧍 ACTIVE
/////////////////////////////////////////////////////

function active(){
  return controlled === "user" ? user : teammate;
}

/////////////////////////////////////////////////////
// 🏒 PICKUP (UNCHANGED)
/////////////////////////////////////////////////////

function pickup(){

  if(owner !== "free") return;
  if(lock) return;

  const p = active();

  const dx = puck.position.x - p.position.x;
  const dz = puck.position.z - p.position.z;

  const d = Math.sqrt(dx*dx + dz*dz);

  if(d < 3.5){
    owner = controlled;
    vx = 0;
    vz = 0;
    vy = 0;
  }
}

/////////////////////////////////////////////////////
// 🏒🔥 ONLY FIXED PART: SHOOT
/////////////////////////////////////////////////////

function shoot(){

  if(owner !== controlled) return;
  if(lock) return;

  lock = true;

  let dx = mouse.x;
  let dz = mouse.y;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ lock=false; return; }

  // 🎯 stable accuracy (no jitter bugs)
  let noise = 0.04;
  dx += (Math.random()-0.5)*noise;
  dz += (Math.random()-0.5)*noise;

  let power = 3.2;

  // 🏒 controlled height (no "jumping puck bug")
  let height = Math.max(0, -mouse.y) * 1.5;

  vx = (dx/len) * power;
  vz = (dz/len) * power;

  vy = height;

  owner = "free";

  setTimeout(()=>lock=false,80);
}

addEventListener("mousedown",shoot);

/////////////////////////////////////////////////////
// 🤝 PASS (UNCHANGED)
/////////////////////////////////////////////////////

function pass(){

  if(owner !== controlled) return;
  if(lock) return;

  lock = true;

  const t = controlled === "user" ? teammate : user;

  const dx = t.position.x - active().position.x;
  const dz = t.position.z - active().position.z;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ lock=false; return; }

  vx = (dx/len)*2.6;
  vz = (dz/len)*2.6;
  vy = 0;

  owner = "free";

  controlled = controlled === "user" ? "teammate" : "user";

  setTimeout(()=>lock=false,80);
}

/////////////////////////////////////////////////////
// 🧊 PHYSICS (UNCHANGED)
/////////////////////////////////////////////////////

function physics(){

  if(owner !== "free"){
    const p = active();
    puck.position.x = p.position.x;
    puck.position.z = p.position.z - 2;
    puck.position.y = 1;
    return;
  }

  puck.position.x += vx;
  puck.position.z += vz;

  puck.position.y += vy;
  vy -= 0.1;

  if(puck.position.y < 1){
    puck.position.y = 1;
    vy = 0;
  }

  vx *= 0.96;
  vz *= 0.96;
}

/////////////////////////////////////////////////////
// LOOP (UNCHANGED)
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  pickup();
  physics();

  camera.position.x += (active().position.x - camera.position.x)*0.04;
  camera.lookAt(active().position.x,0,0);

  renderer.render(scene,camera);
}

loop();

</script>

</body>
</html>
