<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL v3 PRO SIM</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:20px;
}
</style>
</head>
<body>

<div id="hud">SINÄ 0 - 0 AI</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.7));

const light = new THREE.DirectionalLight(0xffffff,1.4);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🎥 CAMERA
/////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff, roughness:0.05})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL (REAL FRAME)
/////////////////////////////////////////////////////

function makeGoal(){

  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0xffffff});

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.2,4,0.2),mat);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.2,4,0.2),mat);
  const top = new THREE.Mesh(new THREE.BoxGeometry(7,0.2,0.2),mat);

  left.position.set(-3.5,2,-40);
  right.position.set(3.5,2,-40);
  top.position.set(0,4,-40);

  g.add(left,right,top);
  scene.add(g);

  return g;
}

const goal = makeGoal();

/////////////////////////////////////////////////////
// 🏒 PLAYER
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);

  p.stamina = 1;
  p.state = "skate";

  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const ai = player(0xff3333,-35);

/////////////////////////////////////////////////////
// 🏒 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse={x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// 🧠 GAME STATE
/////////////////////////////////////////////////////

let vx=0,vz=0;
let hasPuck=false;
let score=0;

/////////////////////////////////////////////////////
// 🎞️ REPLAY BUFFER
/////////////////////////////////////////////////////

let replay = [];

function saveReplay(){
  replay.push({
    x:puck.position.x,
    z:puck.position.z
  });
  if(replay.length>120) replay.shift();
}

/////////////////////////////////////////////////////
// 🏒 PASS SYSTEM
/////////////////////////////////////////////////////

function pass(){
  if(!hasPuck) return;

  vx = (ai.position.x - user.position.x)*0.25;
  vz = (ai.position.z - user.position.z)*0.25;

  hasPuck=false;
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🏒 SHOOT (FIXED: LÄHTEE LAVASTA)
/////////////////////////////////////////////////////

addEventListener("mousedown",()=>{

  if(!hasPuck) return;

  const dx = mouse.x;
  const dz = mouse.y;

  const len = Math.sqrt(dx*dx+dz*dz);

  const nx = dx/len;
  const nz = dz/len;

  const power = 1.6;

  // 👉 tärkeä: pelaajan nopeus mukaan (stick impulse)
  vx = nx * power + user.position.x*0.01;
  vz = nz * power;

  hasPuck = false;
});

/////////////////////////////////////////////////////
// 🤖 AI FORMATION (2-1-2 simplified)
/////////////////////////////////////////////////////

function aiBrain(){

  const attack = puck.position.z < -5;

  ai.position.x += (puck.position.x - ai.position.x)*0.05;

  ai.position.z += attack ? 0.06 : -0.03;

}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK (REAL BOX)
/////////////////////////////////////////////////////

function goalCheck(){
  return (
    puck.position.z < -40 &&
    puck.position.x > -3.5 &&
    puck.position.x < 3.5
  );
}

/////////////////////////////////////////////////////
// 🧊 RESET
/////////////////////////////////////////////////////

function reset(){
  puck.position.set(0,1,0);
  vx=0;vz=0;
  hasPuck=false;

  user.position.set(0,2,35);
  ai.position.set(0,2,-35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  saveReplay();

  /////////////////////////////////////////////////////
  // PLAYER MOVE + STAMINA
  /////////////////////////////////////////////////////

  let speed = 0.9 * user.stamina;

  if(keys["KeyA"]) user.position.x -= speed;
  if(keys["KeyD"]) user.position.x += speed;
  if(keys["KeyW"]) user.position.z -= speed;
  if(keys["KeyS"]) user.position.z += speed;

  user.stamina *= 0.995;
  user.stamina = Math.min(1,user.stamina+0.002);

  /////////////////////////////////////////////////////
  // PUCK PICKUP (stick control)
  /////////////////////////////////////////////////////

  let dx=puck.position.x-user.position.x;
  let dz=puck.position.z-user.position.z;
  let dist=Math.sqrt(dx*dx+dz*dz);

  if(dist<3.5) hasPuck=true;

  /////////////////////////////////////////////////////
  // PUCK PHYSICS
  /////////////////////////////////////////////////////

  if(hasPuck){
    puck.position.x=user.position.x;
    puck.position.z=user.position.z-2;
  } else {
    puck.position.x += vx;
    puck.position.z += vz;

    vx*=0.965;
    vz*=0.965;
  }

  /////////////////////////////////////////////////////
  // AI
  /////////////////////////////////////////////////////

  aiBrain();

  /////////////////////////////////////////////////////
  // GOAL
  /////////////////////////////////////////////////////

  if(goalCheck()){

    score++;

    document.getElementById("hud").innerText=
      "SINÄ "+score+" - AI 0";

    document.getElementById("msg").innerText="GOAL!";

    setTimeout(()=>document.getElementById("msg").innerText="",900);

    reset();
  }

  /////////////////////////////////////////////////////
  // CAMERA
  /////////////////////////////////////////////////////

  camera.position.x += (user.position.x-camera.position.x)*0.04;
  camera.lookAt(user.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
