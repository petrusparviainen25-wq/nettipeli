<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL V7 FULL ENGINE</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:22px;
}
</style>
</head>
<body>

<div id="hud">SINÄ 0 - 0 AI</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.8));

const light = new THREE.DirectionalLight(0xffffff,1.6);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🎥 CAMERA
/////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

function makeGoal(){
  const g = new THREE.Group();
  const red = new THREE.MeshStandardMaterial({color:0xff0000});

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.3,4,0.3),red);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.3,4,0.3),red);
  const top = new THREE.Mesh(new THREE.BoxGeometry(7.5,0.3,0.3),red);

  left.position.set(-3.7,2,-40);
  right.position.set(3.7,2,-40);
  top.position.set(0,4,-40);

  g.add(left,right,top);
  scene.add(g);
}
makeGoal();

/////////////////////////////////////////////////////
// 🧱 BOARDS
/////////////////////////////////////////////////////

function board(x,z,w,h){
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w,2,h),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  b.position.set(x,1,z);
  scene.add(b);
}

board(0,60,200,2);
board(0,-60,200,2);
board(100,0,2,120);
board(-100,0,2,120);

/////////////////////////////////////////////////////
// 🏒 PLAYERS
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);
const ai = player(0xff3333,-35);
const defender = player(0xff7777,-20);

/////////////////////////////////////////////////////
// 🥅 GOALIE (REAL GAME ENTITY)
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PUCK + STATE SYSTEM
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

let puckState = "free"; // FREE / PLAYER / AI

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse={x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// 🧠 PHYSICS
/////////////////////////////////////////////////////

let vx=0,vz=0;
let score=0;

/////////////////////////////////////////////////////
// 🏒 SHOOT (FIXED - ALWAYS RELEASES)
/////////////////////////////////////////////////////

addEventListener("mousedown",()=>{

  if(puckState !== "PLAYER") return;

  const dx = mouse.x;
  const dz = mouse.y - 0.2;

  const len = Math.sqrt(dx*dx + dz*dz);

  vx = (dx/len)*2.8;
  vz = (dz/len)*2.8;

  puckState = "free";
});

/////////////////////////////////////////////////////
// 🤝 PASS (LOCK TARGET)
/////////////////////////////////////////////////////

function pass(){

  if(puckState !== "PLAYER") return;

  const target = teammate;

  const dx = target.position.x - user.position.x;
  const dz = target.position.z - user.position.z;

  const len = Math.sqrt(dx*dx + dz*dz);

  vx = (dx/len)*2.3;
  vz = (dz/len)*2.3;

  puckState = "free";
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🤖 AI
/////////////////////////////////////////////////////

function aiBrain(){

  if(puckState === "free"){

    defender.position.x += (puck.position.x - defender.position.x)*0.06;
    ai.position.x += (puck.position.x - ai.position.x)*0.05;
    ai.position.z += (puck.position.z - ai.position.z)*0.03;
  }
}

/////////////////////////////////////////////////////
// 🥅 GOALIE AI
/////////////////////////////////////////////////////

function goalieAI(){

  const predict = puck.position.x + vx*6;

  goalie.position.x += (predict - goalie.position.x)*0.12;

  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));
}

/////////////////////////////////////////////////////
// 🧊 PUCK LOGIC (IMPORTANT FIX)
/////////////////////////////////////////////////////

function physics(){

  // 👉 player possession
  if(puckState === "PLAYER"){
    puck.position.x = user.position.x;
    puck.position.z = user.position.z - 2;
    puck.position.y = 1;
  }

  // 👉 free puck
  if(puckState === "free"){
    puck.position.x += vx;
    puck.position.z += vz;

    vx *= 0.96;
    vz *= 0.96;
  }
}

/////////////////////////////////////////////////////
// 🧱 PUCK PICKUP
/////////////////////////////////////////////////////

function pickup(){

  let dx = puck.position.x - user.position.x;
  let dz = puck.position.z - user.position.z;

  let dist = Math.sqrt(dx*dx+dz*dz);

  if(dist < 3.5 && puckState === "free"){
    puckState = "PLAYER";
  }
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK
/////////////////////////////////////////////////////

function goalCheck(){
  return (
    puck.position.z < -40 &&
    puck.position.x > -3.7 &&
    puck.position.x < 3.7
  );
}

/////////////////////////////////////////////////////
// 🔁 RESET
/////////////////////////////////////////////////////

function reset(){
  puck.position.set(0,1,0);
  vx=0;vz=0;
  puckState="free";
  user.position.set(0,2,35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  /////////////////////////////////////////////////////
  // MOVE
  /////////////////////////////////////////////////////

  if(keys["KeyA"]) user.position.x -= 0.9;
  if(keys["KeyD"]) user.position.x += 0.9;
  if(keys["KeyW"]) user.position.z -= 0.9;
  if(keys["KeyS"]) user.position.z += 0.9;

  pickup();

  physics();
  aiBrain();
  goalieAI();

  /////////////////////////////////////////////////////
  // GOAL
  /////////////////////////////////////////////////////

  if(goalCheck()){

    score++;

    document.getElementById("hud").innerText =
      "SINÄ "+score+" - AI 0";

    document.getElementById("msg").innerText="GOAL!";

    setTimeout(()=>document.getElementById("msg").innerText="",900);

    reset();
  }

  /////////////////////////////////////////////////////
  // CAMERA
  /////////////////////////////////////////////////////

  camera.position.x += (user.position.x - camera.position.x)*0.04;
  camera.lookAt(user.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
