<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hockey Shoot Fix Guaranteed</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🧠 MINIMAL SAFE STATE (ONLY WHAT SHOOT NEEDS)
/////////////////////////////////////////////////////

let owner = "user";
let controlled = "user";
let lock = false;

let mouse = {x:0,y:0};

let vx = 0, vz = 0, vy = 0;

/////////////////////////////////////////////////////
// 🏒 SHOOT FUNCTION (FIXED)
/////////////////////////////////////////////////////

function shoot(){

  if(owner !== controlled) return;
  if(lock) return;

  lock = true;

  let dx = mouse.x;
  let dz = mouse.y;

  let len = Math.sqrt(dx*dx + dz*dz);

  // 🟢 fallback → EI “ei lähde” bugia
  if(len < 0.0001){
    dx = 0;
    dz = -1;
    len = 1;
  }

  // 🎯 94% accuracy (small controlled error)
  const err = 0.06;

  dx += (Math.random()-0.5) * err;
  dz += (Math.random()-0.5) * err;

  const power = 3.2;

  vx = (dx/len) * power;
  vz = (dz/len) * power;

  // 🟢 height shot
  vy = Math.max(0, -mouse.y * 1.6);

  owner = "free";

  setTimeout(()=>lock=false,50);
}

/////////////////////////////////////////////////////
// 🖱️ GUARANTEED INPUT (IMPORTANT FIX)
/////////////////////////////////////////////////////

window.addEventListener("mousedown", (e) => {
  if(e.button === 0){
    shoot();
  }
});

/////////////////////////////////////////////////////
// 🖱️ MOUSE TRACKING
/////////////////////////////////////////////////////

window.addEventListener("mousemove", (e) => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
});

/////////////////////////////////////////////////////
// 🧪 TEST LOOP (so you SEE it works)
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  // fake puck movement test
  vx *= 0.98;
  vz *= 0.98;
  vy -= 0.1;

  console.log("puck vel:", vx.toFixed(2), vz.toFixed(2), vy.toFixed(2));
}

loop();

</script>

</body>
</html>
