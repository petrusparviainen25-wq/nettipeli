<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>3D NHL COMPLETE</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaadfff);

// 🎥 CAMERA (NHL-kulma)
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 35, 55);
camera.lookAt(0,0,0);

// 🖥 RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 💡 LIGHTING (TÄRKEÄ)
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(10,30,10);
scene.add(light);

const ambient = new THREE.AmbientLight(0x666666);
scene.add(ambient);

// 🧊 ICE
const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(120,80),
  new THREE.MeshStandardMaterial({color:0xe6f7ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// ================= PLAYER =================
const player = new THREE.Group();

const playerBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0x0055ff})
);

const stick = new THREE.Mesh(
  new THREE.BoxGeometry(0.2,0.2,4),
  new THREE.MeshStandardMaterial({color:0x333333})
);
stick.position.z = -2;

player.add(playerBody);
player.add(stick);
player.position.set(0,2,30);
scene.add(player);

// ================= PUCK =================
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
puck.position.set(0,1,10);
scene.add(puck);

// ================= GOAL =================
const goal = new THREE.Mesh(
  new THREE.BoxGeometry(12,6,1),
  new THREE.MeshStandardMaterial({color:0xff0000, wireframe:true})
);
goal.position.set(0,3,-35);
scene.add(goal);

// ================= GOALIE =================
const goalie = new THREE.Group();

const goalieBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.5,2.5,4,8),
  new THREE.MeshStandardMaterial({color:0xffffff})
);

const pads = new THREE.Mesh(
  new THREE.BoxGeometry(2,1,1),
  new THREE.MeshStandardMaterial({color:0xff0000})
);
pads.position.y = -1.5;

goalie.add(goalieBody);
goalie.add(pads);
goalie.position.set(0,2,-32);
scene.add(goalie);

// ================= INPUT =================
let keys = {};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// mouse aim
let mouse = {x:0,y:0};
let aim = new THREE.Vector3();

window.addEventListener("mousemove",(e)=>{
  mouse.x = (e.clientX/window.innerWidth - 0.5)*2;
  mouse.y = (e.clientY/window.innerHeight - 0.5)*2;
});

// ================= PHYSICS =================
let vx = 0, vz = 0;
let score = 0;

// max speed fix
const MAX_SPEED = 1.2;

function clampSpeed(){
  let s = Math.sqrt(vx*vx + vz*vz);
  if(s > MAX_SPEED){
    vx = (vx/s)*MAX_SPEED;
    vz = (vz/s)*MAX_SPEED;
  }
}

// ================= SHOOT =================
window.addEventListener("mousedown",()=>{
  vx = (aim.x - puck.position.x) * 0.25;
  vz = (aim.z - puck.position.z) * 0.25;
});

// ================= LOOP =================
function animate(){

  requestAnimationFrame(animate);

  // 🧍‍♂️ player move
  if(keys["KeyA"]) player.position.x -= 0.7;
  if(keys["KeyD"]) player.position.x += 0.7;
  if(keys["KeyW"]) player.position.z -= 0.7;
  if(keys["KeyS"]) player.position.z += 0.7;

  player.position.x = Math.max(-55,Math.min(55,player.position.x));
  player.position.z = Math.max(-35,Math.min(35,player.position.z));

  // 🎯 aim system
  aim.x = player.position.x + mouse.x * 15;
  aim.z = player.position.z - 20 + mouse.y * 15;

  // 🏒 puck physics
  puck.position.x += vx;
  puck.position.z += vz;

  vx *= 0.98;
  vz *= 0.98;

  clampSpeed();

  // 🧍‍♂️ puck control
  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 4){
    vx += dx * 0.03;
    vz += dz * 0.03;
  }

  // 🥅 goalie AI
  goalie.position.x += (puck.position.x - goalie.position.x) * 0.05;

  // 🧤 block shot
  if(puck.position.z < -30 &&
     Math.abs(puck.position.x - goalie.position.x) < 3){
    vz *= -0.6;
  }

  // 🥅 goal
  if(puck.position.z < -35){
    score++;
    console.log("GOAL:",score);

    puck.position.set(0,1,10);
    vx = 0; vz = 0;
  }

  renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
