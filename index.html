<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL V17 REAL FULL</title>
<style>
body { margin:0; overflow:hidden; background:#87cfff; }
canvas { display:block; }
#score{
 position:absolute;
 top:10px;
 left:10px;
 color:white;
 font-family:Arial;
 font-size:22px;
}
</style>
</head>
<body>

<div id="score">0 - 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 CORE
/////////////////////////////////////////////////////

let scene, camera, renderer;

let puck, user, team, ai1, ai2, goalie;

let vx=0, vz=0, vy=0;
let velX=0, velZ=0;

let keys={};
let mouse={x:0,y:0};

let controlled="user";
let score=0;

/////////////////////////////////////////////////////
// INIT SAFE
/////////////////////////////////////////////////////

function init(){

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,25,60);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// lights
scene.add(new THREE.AmbientLight(0xffffff,1.2));

let light = new THREE.DirectionalLight(0xffffff,1.3);
light.position.set(10,30,10);
scene.add(light);

// world
ice();
boards();
goalNet();
players();
puckObj();

}

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

function ice(){
 let g = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
 );
 g.rotation.x = -Math.PI/2;
 scene.add(g);
}

/////////////////////////////////////////////////////
// 🧱 BOARDS
/////////////////////////////////////////////////////

function boards(){

 const m = new THREE.MeshStandardMaterial({color:0xffffff});

 const a = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const b = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const c = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);
 const d = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);

 a.position.set(-100,1.5,0);
 b.position.set(100,1.5,0);
 c.position.set(0,1.5,-60);
 d.position.set(0,1.5,60);

 scene.add(a,b,c,d);
}

/////////////////////////////////////////////////////
// 🥅 GOAL (VISIBLE FIXED)
/////////////////////////////////////////////////////

function goalNet(){

 const g = new THREE.Group();

 const mat = new THREE.MeshStandardMaterial({
  color:0xff0000,
  emissive:0x330000
 });

 const netMat = new THREE.MeshStandardMaterial({
  color:0xffffff,
  wireframe:true,
  opacity:0.7,
  transparent:true
 });

 const z = -25;

 const left = new THREE.Mesh(new THREE.BoxGeometry(1,10,1),mat);
 const right = new THREE.Mesh(new THREE.BoxGeometry(1,10,1),mat);
 const top = new THREE.Mesh(new THREE.BoxGeometry(14,1,1),mat);

 const back = new THREE.Mesh(
  new THREE.BoxGeometry(12,8,2),
  netMat
 );

 left.position.set(-6,5,z);
 right.position.set(6,5,z);
 top.position.set(0,10,z);
 back.position.set(0,4,z-2);

 g.add(left,right,top,back);

 scene.add(g);
}

/////////////////////////////////////////////////////
// 🧍 PLAYER V2 (REAL EQUIPMENT)
/////////////////////////////////////////////////////

function player(color,x,z){

 const g = new THREE.Group();

 const jersey = new THREE.Mesh(
  new THREE.CylinderGeometry(1.2,1.4,3.4,12),
  new THREE.MeshStandardMaterial({color})
 );

 const helmet = new THREE.Mesh(
  new THREE.SphereGeometry(0.78,16,16),
  new THREE.MeshStandardMaterial({color:0x111111})
 );

 const pants = new THREE.Mesh(
  new THREE.BoxGeometry(1.6,1.2,1.6),
  new THREE.MeshStandardMaterial({color:0x222222})
 );

 const gloveL = new THREE.Mesh(
  new THREE.BoxGeometry(0.5,0.5,1),
  new THREE.MeshStandardMaterial({color:0x111111})
 );

 const gloveR = gloveL.clone();

 const skateL = new THREE.Mesh(
  new THREE.BoxGeometry(0.4,0.4,1.2),
  new THREE.MeshStandardMaterial({color:0x000000})
 );

 const skateR = skateL.clone();

 const stick = new THREE.Mesh(
  new THREE.BoxGeometry(0.12,0.12,3.6),
  new THREE.MeshStandardMaterial({color:0x6b3e1d})
 );

 jersey.position.y = 2;
 helmet.position.y = 4.4;
 pants.position.y = 1.2;

 gloveL.position.set(-1.3,2.3,0.4);
 gloveR.position.set(1.3,2.3,0.4);

 skateL.position.set(-0.5,0.4,0);
 skateR.position.set(0.5,0.4,0);

 stick.position.set(1.6,1.4,1.3);
 stick.rotation.x = Math.PI/2;
 stick.rotation.z = 0.4;

 g.add(jersey);
 g.add(helmet);
 g.add(pants);
 g.add(gloveL);
 g.add(gloveR);
 g.add(skateL);
 g.add(skateR);
 g.add(stick);

 g.position.set(x,0,z);

 scene.add(g);
 return g;
}

/////////////////////////////////////////////////////
// 🥅 GOALIE V2 (REAL NHL PAD + MASK)
/////////////////////////////////////////////////////

function goaliePlayer(x,z){

 const g = new THREE.Group();

 const padMat = new THREE.MeshStandardMaterial({color:0xffffff});
 const maskMat = new THREE.MeshStandardMaterial({color:0xffffff});

 const chest = new THREE.Mesh(
  new THREE.BoxGeometry(2.2,2.8,1.8),
  padMat
 );

 const mask = new THREE.Mesh(
  new THREE.SphereGeometry(0.9,16,16),
  maskMat
 );

 const padL = new THREE.Mesh(
  new THREE.BoxGeometry(0.8,2.5,0.8),
  padMat
 );

 const padR = padL.clone();

 const glove = new THREE.Mesh(
  new THREE.BoxGeometry(0.6,0.6,1.2),
  padMat
 );

 const blocker = glove.clone();

 chest.position.y = 2.5;
 mask.position.y = 4.2;

 padL.position.set(-0.8,1.2,0);
 padR.position.set(0.8,1.2,0);

 glove.position.set(-1.5,2.5,0.5);
 blocker.position.set(1.5,2.5,0.5);

 g.add(chest);
 g.add(mask);
 g.add(padL);
 g.add(padR);
 g.add(glove);
 g.add(blocker);

 g.position.set(x,0,z);

 scene.add(g);
 return g;
}

/////////////////////////////////////////////////////
// PLAYERS
/////////////////////////////////////////////////////

function players(){
 user = player(0x0066ff,0,30);
 team = player(0x3399ff,6,30);
 ai1 = player(0xff4444,-5,-20);
 ai2 = player(0xff7777,5,-25);
 goalie = goaliePlayer(0,-25);
}

/////////////////////////////////////////////////////
// PUCK
/////////////////////////////////////////////////////

function puckObj(){

 puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
 );

 puck.rotation.x = Math.PI/2;
 puck.position.set(0,1,0);

 scene.add(puck);
}

/////////////////////////////////////////////////////
// INPUT
/////////////////////////////////////////////////////

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
 mouse.x = (e.clientX/innerWidth - 0.5)*2;
 mouse.y = (e.clientY/innerHeight - 0.5)*2;
});

/////////////////////////////////////////////////////
// ACTIVE
/////////////////////////////////////////////////////

function active(){
 return controlled==="user"?user:team;
}

/////////////////////////////////////////////////////
// MOVE
/////////////////////////////////////////////////////

function move(){

 let p = active();
 if(!p) return;

 let acc = 0.12;

 if(keys["KeyA"]) velX -= acc;
 if(keys["KeyD"]) velX += acc;
 if(keys["KeyW"]) velZ -= acc;
 if(keys["KeyS"]) velZ += acc;

 velX *= 0.88;
 velZ *= 0.88;

 p.position.x += velX;
 p.position.z += velZ;
}

/////////////////////////////////////////////////////
// PICKUP
/////////////////////////////////////////////////////

function pickup(){

 let p = active();
 if(!p || !puck) return;

 let dx = puck.position.x - p.position.x;
 let dz = puck.position.z - p.position.z;

 if(Math.hypot(dx,dz) < 3.5){
  puck.position.x += (p.position.x - puck.position.x)*0.35;
  puck.position.z += (p.position.z - puck.position.z)*0.35;
  puck.position.y = 1;
 }
}

/////////////////////////////////////////////////////
// SHOOT
/////////////////////////////////////////////////////

function shoot(){

 let p = active();
 if(!p || !puck) return;

 if(puckOwner !== controlled) return;

 // 🎯 aim vector (hiiri)
 let dx = mouse.x;
 let dz = mouse.y;

 let len = Math.hypot(dx,dz);
 if(len < 0.001){ dx=0; dz=-1; len=1; }

 dx /= len;
 dz /= len;

 // 🔥 REALISTIC SPREAD (ei laser-tarkkuutta)
 const spread = 0.18; // 👈 säädä vaikeutta

 dx += (Math.random()-0.5)*spread;
 dz += (Math.random()-0.5)*spread;

 // normalisointi uudelleen
 let len2 = Math.hypot(dx,dz);
 dx /= len2;
 dz /= len2;

 // 🏒 voima
 const power = 5.2;

 vx = dx * power;
 vz = dz * power;

 // 🎯 korkeus (nyt EI aina ylös)
 vy = (-mouse.y * 2.0) + (Math.random()-0.5)*0.4;

 // 🧠 vapautus
 puckOwner = null;
}
/////////////////////////////////////////////////////
// PASS
/////////////////////////////////////////////////////

function pass(){

 let p = active();
 let t = controlled==="user"?team:user;

 let dx = t.position.x - p.position.x;
 let dz = t.position.z - p.position.z;

 let len = Math.hypot(dx,dz);
 if(len < 0.001) return;

 dx /= len;
 dz /= len;

 vx = dx * 3.8;
 vz = dz * 3.8;
 vy = 0;

 controlled = controlled==="user"?"team":"user";
}

addEventListener("keydown",e=>{
 if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// PHYSICS
/////////////////////////////////////////////////////

function physics(){

 puck.position.x += vx;
 puck.position.z += vz;
 puck.position.y += vy;

 vy -= 0.08;

 if(puck.position.y < 1){
  puck.position.y = 1;
  vy = 0;
 }

 vx *= 0.96;
 vz *= 0.96;
}

/////////////////////////////////////////////////////
// GOAL
/////////////////////////////////////////////////////

function goal(){

 if(
  puck.position.z < -25 &&
  puck.position.x > -6 &&
  puck.position.x < 6
 ){

  score++;
  document.getElementById("score").innerText = score + " - 0";

  puck.position.set(0,1,0);
  vx = vz = vy = 0;
 }
}

/////////////////////////////////////////////////////
// CAMERA
/////////////////////////////////////////////////////

function cam(){

 let p = active();
 if(!p) return;

 camera.position.x += (p.position.x - camera.position.x)*0.08;
 camera.position.z += (p.position.z + 25 - camera.position.z)*0.08;

 camera.lookAt(p.position.x,0,p.position.z);
}

/////////////////////////////////////////////////////
// LOOP
/////////////////////////////////////////////////////

function loop(){

 requestAnimationFrame(loop);

 move();
 pickup();
 physics();
 goal();
 cam();

 renderer.render(scene,camera);
}

init();
loop();

</script>

</body>
</html>
