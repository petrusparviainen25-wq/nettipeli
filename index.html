<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL V4 FULL</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

#score{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:24px;
font-family:Arial;
}
</style>
</head>
<body>

<div id="score">0 - 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ===== WORLD =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,25,60);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

// ===== ICE =====
const ice = new THREE.Mesh(
 new THREE.PlaneGeometry(200,120),
 new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// ===== BOARDS =====
function boardsMesh(){
 const m = new THREE.MeshStandardMaterial({color:0xffffff});

 const left = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const right = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const top = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);
 const bottom = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);

 left.position.set(-100,1.5,0);
 right.position.set(100,1.5,0);
 top.position.set(0,1.5,-60);
 bottom.position.set(0,1.5,60);

 scene.add(left,right,top,bottom);
}
boardsMesh();

// ===== GOAL =====
function goal(){
 const g=new THREE.Group();
 const m=new THREE.MeshStandardMaterial({color:0xff0000});

 const l=new THREE.Mesh(new THREE.BoxGeometry(0.5,10,0.5),m);
 const r=new THREE.Mesh(new THREE.BoxGeometry(0.5,10,0.5),m);
 const t=new THREE.Mesh(new THREE.BoxGeometry(14,0.5,0.5),m);

 l.position.set(-7,5,-40);
 r.position.set(7,5,-40);
 t.position.set(0,10,-40);

 g.add(l,r,t);
 scene.add(g);
}
goal();

// ===== PLAYERS =====
function player(c,x,z){
 const p=new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,6,10),
  new THREE.MeshStandardMaterial({color:c})
 );
 p.position.set(x,2,z);
 scene.add(p);
 return p;
}

const user = player(0x0066ff,0,30);
const team = player(0x3399ff,6,30);
const ai1 = player(0xff3333,-5,-20);
const ai2 = player(0xff5555,5,-25);

// ===== GOALIE =====
const goalie = new THREE.Mesh(
 new THREE.CapsuleGeometry(1.6,2.5,6,10),
 new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

// ===== PUCK =====
const puck = new THREE.Mesh(
 new THREE.CylinderGeometry(1,1,0.5,16),
 new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x=Math.PI/2;
puck.position.set(0,1,0);
scene.add(puck);

// ===== STATE =====
let vx=0,vz=0,vy=0;
let mouse={x:0,y:0};
let keys={};
let controlled="user";

let velX=0,velZ=0;
let score=0;

// ===== INPUT =====
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
 mouse.x=(e.clientX/innerWidth-0.5)*2;
 mouse.y=(e.clientY/innerHeight-0.5)*2;
});

// ===== ACTIVE =====
function active(){
 return controlled==="user"?user:team;
}

// ===== MOVE (MOMENTUM) =====
function move(){
 const p=active();

 let acc=0.15;

 if(keys["KeyA"]) velX-=acc;
 if(keys["KeyD"]) velX+=acc;
 if(keys["KeyW"]) velZ-=acc;
 if(keys["KeyS"]) velZ+=acc;

 velX*=0.9;
 velZ*=0.9;

 p.position.x+=velX;
 p.position.z+=velZ;
}

// ===== PUCK =====
function hasPuck(){
 const p=active();
 let dx=puck.position.x-p.position.x;
 let dz=puck.position.z-p.position.z;
 return Math.sqrt(dx*dx+dz*dz)<3;
}

function pickup(){

  if(!hasPuck()) return;

  const p = active();

  let dirX = velX;
  let dirZ = velZ;

  let len = Math.sqrt(dirX*dirX + dirZ*dirZ);

  if(len < 0.01){
    dirX = 0;
    dirZ = -1;
    len = 1;
  }

  dirX /= len;
  dirZ /= len;

  puck.position.x = p.position.x + dirX * 2;
  puck.position.z = p.position.z + dirZ * 2;
  puck.position.y = 1;
}
// ===== SHOOT (HIGH SAFE) =====
addEventListener("mousedown",()=>{
 if(!hasPuck()) return;

 let dx=mouse.x;
 let dz=mouse.y;
 let len=Math.sqrt(dx*dx+dz*dz);

 if(len===0){dx=0;dz=-1;len=1;}

 vx=(dx/len)*5;
 vz=(dz/len)*5;

 // korkea laukaus
 let lift=Math.max(0,-mouse.y);
 vy=lift*2;
});

// ===== GOALIE SAVE TYPES =====
function goalieSave(){

 let dx=puck.position.x-goalie.position.x;
 let dz=puck.position.z-goalie.position.z;
 let dist=Math.sqrt(dx*dx+dz*dz);

 if(puck.position.z<-34 && dist<4){

  // 🧠 valitaan torjuntatyyppi
  if(puck.position.y > 2.5){
   // 🧤 glove save
   vx*=-0.5;
   vz*=0.2;
   vy=1.2;
  }
  else if(Math.abs(dx)<2){
   // 🧎 butterfly
   vx*=0.2;
   vz*=0.3;
   vy=0.5;
  }
  else{
   // 🦵 pad save
   vx*=-0.3;
   vz*=0.4;
   vy=1;
  }
 }
}

// ===== GOALIE AI =====
function goalieAI(){
 const target=puck.position.x;
 goalie.position.x+=(target-goalie.position.x)*0.1;
}

// ===== AI ENEMIES =====
function ai(){

 // seuraa kiekkoa
 ai1.position.x += (puck.position.x-ai1.position.x)*0.04;
 ai2.position.x += (puck.position.x-ai2.position.x)*0.04;

 ai1.position.z += (puck.position.z-ai1.position.z)*0.02;
 ai2.position.z += (puck.position.z-ai2.position.z)*0.02;

 // blokkaus
 let d1=Math.hypot(puck.position.x-ai1.position.x,puck.position.z-ai1.position.z);
 let d2=Math.hypot(puck.position.x-ai2.position.x,puck.position.z-ai2.position.z);

 if(d1<2){vx*=0.5;vz*=0.5;}
 if(d2<2){vx*=0.5;vz*=0.5;}
}

// ===== BOARDS =====
function boards(){
 if(puck.position.x<-98){puck.position.x=-98;vx*=-0.6;}
 if(puck.position.x>98){puck.position.x=98;vx*=-0.6;}
 if(puck.position.z<-58){puck.position.z=-58;vz*=-0.6;}
 if(puck.position.z>58){puck.position.z=58;vz*=-0.6;}
}

// ===== GOAL =====
function goalCheck(){
 if(puck.position.z<-40 && puck.position.x>-7 && puck.position.x<7){
  score++;
  document.getElementById("score").innerText = score+" - 0";
  puck.position.set(0,1,0);
  vx=vz=vy=0;
 }
}

// ===== PHYSICS =====
function physics(){

 puck.position.x+=vx;
 puck.position.z+=vz;
 puck.position.y+=vy;

 vy-=0.08;

 if(puck.position.y<1){
  puck.position.y=1;
  vy=0;
 }

 vx*=0.96;
 vz*=0.96;

 boards();
 goalieAI();
 goalieSave();
 ai();
 goalCheck();
}

// ===== CAMERA =====
function cam(){
 const p=active();

 camera.position.x+=(p.position.x-camera.position.x)*0.08;
 camera.position.z+=(p.position.z+25-camera.position.z)*0.08;

 camera.lookAt(p.position.x,0,p.position.z-10);
}

// ===== LOOP =====
function loop(){
 requestAnimationFrame(loop);

 move();
 pickup();
 physics();
 cam();

 renderer.render(scene,camera);
}

loop();

</script>

</body>
</html>
