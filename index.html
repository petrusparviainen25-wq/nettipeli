<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL v4 CINEMATIC ENGINE</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:24px;
}
</style>
</head>
<body>

<div id="hud">SINÄ 0 - 0 AI</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.7));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🎥 CAMERA (cinematic follow)
/////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff, roughness:0.05})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🧱 REALISTIC BOARDS
/////////////////////////////////////////////////////

function board(x,z,w,h){
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w,2,h),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  b.position.set(x,1,z);
  scene.add(b);
}

board(0,60,200,2);
board(0,-60,200,2);
board(100,0,2,120);
board(-100,0,2,120);

/////////////////////////////////////////////////////
// 🥅 GOAL (RED + BIG + NET FEEL)
/////////////////////////////////////////////////////

function goal(){

  const g = new THREE.Group();

  const red = new THREE.MeshStandardMaterial({color:0xff0000});

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.3,4,0.3),red);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.3,4,0.3),red);
  const top = new THREE.Mesh(new THREE.BoxGeometry(7.5,0.3,0.3),red);

  left.position.set(-3.7,2,-40);
  right.position.set(3.7,2,-40);
  top.position.set(0,4,-40);

  g.add(left,right,top);
  scene.add(g);

  return g;
}

goal();

/////////////////////////////////////////////////////
// 🏒 PLAYERS (TEAM SYSTEM)
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);

  p.state = "skate";
  p.stamina = 1;

  scene.add(p);
  return p;
}

// oma joukkue
const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);

// AI joukkue
const ai = player(0xff3333,-35);
const defender = player(0xff7777,-20);

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse={x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// 🧠 STATE
/////////////////////////////////////////////////////

let vx=0,vz=0;
let hasPuck=false;
let score=0;

/////////////////////////////////////////////////////
// 🏒 PASS SYSTEM
/////////////////////////////////////////////////////

function pass(){

  if(!hasPuck) return;

  vx = (teammate.position.x - user.position.x)*0.25;
  vz = (teammate.position.z - user.position.z)*0.25;

  hasPuck = false;
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🏒 SHOOT (REAL STICK RELEASE FIX)
/////////////////////////////////////////////////////

addEventListener("mousedown",()=>{

  if(!hasPuck) return;

  const dx = mouse.x;
  const dz = mouse.y;

  const len = Math.sqrt(dx*dx+dz*dz);

  vx = (dx/len)*1.8;
  vz = (dz/len)*1.8;

  hasPuck = false; // 👉 TÄRKEÄ: aina irtoaa lavasta
});

/////////////////////////////////////////////////////
// 🤖 AI FORMATION (2-1-2 style)
/////////////////////////////////////////////////////

function aiBrain(){

  // puolustus
  if(puck.position.z < 15){
    defender.position.x += (puck.position.x - defender.position.x)*0.05;
  }

  // hyökkäys
  ai.position.x += (puck.position.x - ai.position.x)*0.04;
  ai.position.z += (puck.position.z - ai.position.z)*0.03;
}

/////////////////////////////////////////////////////
// 🥅 GOALIE AI (dive logic base)
/////////////////////////////////////////////////////

function goalieAI(){

  const predict = puck.position.x + vx*5;

  goalie.position.x += (predict - goalie.position.x)*0.12;
  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));
}

/////////////////////////////////////////////////////
// 🧊 PUCK PHYSICS
/////////////////////////////////////////////////////

function puckPhysics(){

  if(hasPuck){
    puck.position.x = user.position.x;
    puck.position.z = user.position.z - 2;
  } else {
    puck.position.x += vx;
    puck.position.z += vz;

    vx *= 0.96;
    vz *= 0.96;
  }
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK (REAL)
/////////////////////////////////////////////////////

function goalCheck(){
  return (
    puck.position.z < -40 &&
    puck.position.x > -3.7 &&
    puck.position.x < 3.7
  );
}

/////////////////////////////////////////////////////
// 🔁 RESET
/////////////////////////////////////////////////////

function reset(){
  puck.position.set(0,1,0);
  vx=0;vz=0;
  hasPuck=false;

  user.position.set(0,2,35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  /////////////////////////////////////////////////////
  // PLAYER MOVEMENT
  /////////////////////////////////////////////////////

  let speed = 0.9 * user.stamina;

  if(keys["KeyA"]) user.position.x -= speed;
  if(keys["KeyD"]) user.position.x += speed;
  if(keys["KeyW"]) user.position.z -= speed;
  if(keys["KeyS"]) user.position.z += speed;

  /////////////////////////////////////////////////////
  // PUCK CONTROL
  /////////////////////////////////////////////////////

  let dx = puck.position.x - user.position.x;
  let dz = puck.position.z - user.position.z;
  let dist = Math.sqrt(dx*dx+dz*dz);

  if(dist < 3.5) hasPuck = true;

  puckPhysics();

  /////////////////////////////////////////////////////
  // AI
  /////////////////////////////////////////////////////

  aiBrain();
  goalieAI();

  /////////////////////////////////////////////////////
  // GOAL
  /////////////////////////////////////////////////////

  if(goalCheck()){

    score++;

    document.getElementById("hud").innerText =
      "SINÄ "+score+" - AI 0";

    document.getElementById("msg").innerText="GOAL!";

    setTimeout(()=>{
      document.getElementById("msg").innerText="";
    },900);

    reset();
  }

  /////////////////////////////////////////////////////
  // CAMERA (cinematic follow)
  /////////////////////////////////////////////////////

  camera.position.x += (user.position.x - camera.position.x)*0.04;
  camera.lookAt(user.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
