<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hockey FULL V3</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:20px;
}
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.9));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

function goal(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0xff0000});

  const l = new THREE.Mesh(new THREE.BoxGeometry(0.4,4,0.4),mat);
  const r = new THREE.Mesh(new THREE.BoxGeometry(0.4,4,0.4),mat);
  const t = new THREE.Mesh(new THREE.BoxGeometry(8,0.4,0.4),mat);

  l.position.set(-4,2,-40);
  r.position.set(4,2,-40);
  t.position.set(0,4,-40);

  g.add(l,r,t);
  scene.add(g);
}
goal();

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PLAYERS
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);
const ai = player(0xff3333,-35);
const defender = player(0xff7777,-20);

/////////////////////////////////////////////////////
// 🧊 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🧠 STATE
/////////////////////////////////////////////////////

let owner = "free";
let vx = 0;
let vz = 0;
let score = 0;

let controlled = "user";
let actionLock = false;

let mouse = {x:0,y:0};
let highShot = false;

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
  mouse.x = (e.clientX/innerWidth - 0.5)*2;
  mouse.y = (e.clientY/innerHeight - 0.5)*2;

  // ✔ HIGH SHOT FIX (NOW USED PROPERLY)
  highShot = mouse.y < -0.25;
});

/////////////////////////////////////////////////////
// 🧍 ACTIVE PLAYER
/////////////////////////////////////////////////////

function p(){
  return controlled === "user" ? user : teammate;
}

/////////////////////////////////////////////////////
// 🏒 PICKUP
/////////////////////////////////////////////////////

function pickup(){

  if(owner !== "free") return;
  if(actionLock) return;

  const pl = p();

  const dx = puck.position.x - pl.position.x;
  const dz = puck.position.z - pl.position.z;

  const d = Math.sqrt(dx*dx + dz*dz);

  if(d < 3.5){
    owner = controlled;
    vx = 0;
    vz = 0;
  }
}

/////////////////////////////////////////////////////
// 🏒 SHOOT (HIGH + LOW WORKING)
/////////////////////////////////////////////////////

function shoot(){

  if(owner !== controlled) return;
  if(actionLock) return;

  actionLock = true;

  let dx = mouse.x;
  let dz = mouse.y;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ actionLock=false; return; }

  let power = 3.2;

  // ✔ HIGH SHOT FIX
  if(highShot){
    power = 2.6;
    puck.position.y = 2.5;
  } else {
    puck.position.y = 1;
  }

  vx = (dx/len)*power;
  vz = (dz/len)*power;

  owner = "free";

  setTimeout(()=>actionLock=false,80);
}

addEventListener("mousedown",shoot);

/////////////////////////////////////////////////////
// 🤝 PASS + SWITCH (FIXED)
/////////////////////////////////////////////////////

function pass(){

  if(owner !== controlled) return;
  if(actionLock) return;

  actionLock = true;

  const target = controlled === "user" ? teammate : user;

  const dx = target.position.x - p().position.x;
  const dz = target.position.z - p().position.z;

  const len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ actionLock=false; return; }

  vx = (dx/len)*2.6;
  vz = (dz/len)*2.6;

  owner = "free";

  // ✔ NHL STYLE SWITCH
  controlled = controlled === "user" ? "teammate" : "user";

  setTimeout(()=>actionLock=false,80);
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🧊 PUCK PHYSICS
/////////////////////////////////////////////////////

function physics(){

  if(owner !== "free"){
    const pl = p();
    puck.position.x = pl.position.x;
    puck.position.z = pl.position.z - 2;
    return;
  }

  puck.position.x += vx;
  puck.position.z += vz;

  vx *= 0.96;
  vz *= 0.96;

  if(Math.abs(vx)<0.01) vx=0;
  if(Math.abs(vz)<0.01) vz=0;
}

/////////////////////////////////////////////////////
// 🤖 AI
/////////////////////////////////////////////////////

function ai(){

  ai.position.x += (puck.position.x - ai.position.x)*0.05;
  defender.position.x += (puck.position.x - defender.position.x)*0.05;
}

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

function goalieAI(){
  goalie.position.x += (puck.position.x - goalie.position.x)*0.08;
  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK
/////////////////////////////////////////////////////

function isGoal(){
  return (
    puck.position.z < -40 &&
    puck.position.x > -4 &&
    puck.position.x < 4
  );
}

/////////////////////////////////////////////////////
// 🔁 RESET
/////////////////////////////////////////////////////

function reset(){

  puck.position.set(0,1,0);
  vx = 0;
  vz = 0;
  owner = "free";
  controlled = "user";

  user.position.set(0,2,35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  const pl = p();

  if(keys["KeyA"]) pl.position.x -= 0.9;
  if(keys["KeyD"]) pl.position.x += 0.9;
  if(keys["KeyW"]) pl.position.z -= 0.9;
  if(keys["KeyS"]) pl.position.z += 0.9;

  pickup();
  physics();
  ai();
  goalieAI();

  if(isGoal()){

    score++;

    document.getElementById("hud").innerText =
      "0 - " + score;

    document.getElementById("msg").innerText = "GOAL!";

    setTimeout(()=>document.getElementById("msg").innerText="",800);

    reset();
  }

  camera.position.x += (pl.position.x - camera.position.x)*0.04;
  camera.lookAt(pl.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
