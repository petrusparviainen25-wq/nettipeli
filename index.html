<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>EA-STYLE NHL BROWSER ENGINE</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
}

#replay {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:20px;
}
</style>
</head>
<body>

<div id="hud">SINÄ 0 - 0 AI</div>
<div id="replay"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.7));

const light = new THREE.DirectionalLight(0xffffff,1.4);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🎥 CAMERA
/////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(180,110),
  new THREE.MeshStandardMaterial({
    color:0xdff6ff,
    roughness:0.05,
    metalness:0.2
  })
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🧍 PLAYER SYSTEM (STATE MACHINE)
/////////////////////////////////////////////////////

function makePlayer(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );

  p.position.set(0,2,z);

  p.state = "idle";
  p.vx = 0;
  p.vz = 0;

  scene.add(p);
  return p;
}

const player = makePlayer(0x0066ff,35);
const ai = makePlayer(0xff3333,-35);

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,18),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse = {x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// 🧠 GAME STATE
/////////////////////////////////////////////////////

let vx=0,vz=0;
let hasPuck=false;
let score=0;

/////////////////////////////////////////////////////
// 🎞️ REPLAY SYSTEM (EA FEATURE)
/////////////////////////////////////////////////////

let replayBuffer = [];

function saveFrame(){
  replayBuffer.push({
    puck:{x:puck.position.x,z:puck.position.z}
  });

  if(replayBuffer.length > 120) replayBuffer.shift();
}

/////////////////////////////////////////////////////
// 🏒 SHOOT
/////////////////////////////////////////////////////

addEventListener("mousedown",()=>{

  if(!hasPuck) return;

  const aimX = player.position.x + mouse.x*30;
  const aimZ = player.position.z + mouse.y*30 - 15;

  vx = (aimX - player.position.x) * 0.30;
  vz = (aimZ - player.position.z) * 0.30;

  hasPuck = false;
});

/////////////////////////////////////////////////////
// 🤖 AI (EA-style decision delay)
/////////////////////////////////////////////////////

function aiBrain(){

  let attack = puck.position.z < -5;

  let target = attack ? puck.position.x : 0;

  ai.position.x += (target - ai.position.x)*0.05;

  ai.position.z += attack ? 0.06 : -0.03;

  ai.position.x = clamp(ai.position.x,-70,70);
  ai.position.z = clamp(ai.position.z,-45,-5);
}

/////////////////////////////////////////////////////
// 🥅 GOALIE (prediction model)
/////////////////////////////////////////////////////

function goalieAI(){

  let predictX = puck.position.x + vx*5;

  goalie.position.x += (predictX - goalie.position.x)*0.12;
  goalie.position.x = clamp(goalie.position.x,-6,6);

  goalie.position.z = -38;
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/////////////////////////////////////////////////////
// 🔁 RESET + REPLAY TRIGGER
/////////////////////////////////////////////////////

function reset(){
  puck.position.set(0,1,0);
  vx=0;vz=0;
  hasPuck=false;

  player.position.set(0,2,35);
  ai.position.set(0,2,-35);
  goalie.position.set(0,2,-38);
}

/////////////////////////////////////////////////////
// 🎮 MAIN ENGINE LOOP (EA STYLE SIM STEP)
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  saveFrame();

  /////////////////////////////////////////////////////
  // 🧍 PLAYER STATE MACHINE (simplified)
  /////////////////////////////////////////////////////

  let speed = 0.9;

  if(keys["KeyA"]) player.position.x -= speed;
  if(keys["KeyD"]) player.position.x += speed;
  if(keys["KeyW"]) player.position.z -= speed;
  if(keys["KeyS"]) player.position.z += speed;

  player.position.x = clamp(player.position.x,-70,70);
  player.position.z = clamp(player.position.z,-20,60);

  /////////////////////////////////////////////////////
  // 🏒 PUCK CONTROL (EA stick feel)
  /////////////////////////////////////////////////////

  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx+dz*dz);

  if(dist < 3.5) hasPuck = true;

  if(hasPuck){
    puck.position.x = player.position.x;
    puck.position.z = player.position.z - 2;
    puck.position.y = 1;
  } else {
    puck.position.x += vx;
    puck.position.z += vz;

    vx *= 0.965;
    vz *= 0.965;
  }

  /////////////////////////////////////////////////////
  // 🤖 AI + 🥅 GOALIE
  /////////////////////////////////////////////////////

  aiBrain();
  goalieAI();

  /////////////////////////////////////////////////////
  // 🧤 SAVE MODEL (EA-style probability feel)
  /////////////////////////////////////////////////////

  if(puck.position.z < -37 &&
     Math.abs(puck.position.x - goalie.position.x) < 3){
    vx *= -0.5;
  }

  /////////////////////////////////////////////////////
  // 🥅 GOAL EVENT + REPLAY TRIGGER
  /////////////////////////////////////////////////////

  if(puck.position.z < -40){

    score++;

    document.getElementById("hud").innerText =
      "SINÄ " + score + " - AI 0";

    document.getElementById("replay").innerText =
      "REPLAY (EA STYLE SIM)";

    setTimeout(()=>{
      document.getElementById("replay").innerText="";
    },1200);

    reset();
  }

  /////////////////////////////////////////////////////
  // 🎥 BROADCAST CAMERA (EA feel)
  /////////////////////////////////////////////////////

  camera.position.x += (player.position.x - camera.position.x)*0.04;
  camera.lookAt(player.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

/////////////////////////////////////////////////////
// 📏 RESIZE
/////////////////////////////////////////////////////

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
