<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL ULTRA WEB ENGINE</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
  z-index:10;
}
</style>
</head>
<body>

<div id="hud">YOU 0 - 0 AI</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ================= WORLD =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaadfff);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,30,55);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.DirectionalLight(0xffffff,1.3).position.set(10,30,10));
scene.add(new THREE.AmbientLight(0x666666));

// ================= ICE =================
const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(140,90),
  new THREE.MeshStandardMaterial({color:0xe8f6ff, roughness:0.1})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// center line
scene.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-70,0.1,0),
    new THREE.Vector3(70,0.1,0)
  ]),
  new THREE.LineBasicMaterial({color:0xff0000})
));

// ================= PLAYER =================
const player = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0x0066ff})
);
player.position.set(0,2,35);
scene.add(player);

// ================= AI =================
const ai = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0xff3333})
);
ai.position.set(0,2,-35);
scene.add(ai);

// ================= GOALIE =================
const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.5,2.5,4,8),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

// ================= PUCK =================
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
puck.position.set(0,1,0);
scene.add(puck);

// ================= INPUT =================
let keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse={x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

// ================= GAME STATE =================
let vx=0,vz=0;
let hasPuck=false;

let scorePlayer=0;
let scoreAI=0;

// ================= AIM =================
function aimPoint(){
  return {
    x: player.position.x + mouse.x*22,
    z: player.position.z + mouse.y*22 - 15
  };
}

// ================= SHOOT =================
addEventListener("mousedown",()=>{

  if(!hasPuck) return;

  const a = aimPoint();

  vx = (a.x - player.position.x) * 0.33;
  vz = (a.z - player.position.z) * 0.33;

  hasPuck = false;
});

// ================= AI SYSTEM =================
function aiLogic(){

  // attack/defense hybrid
  let targetX = puck.position.x * 0.8;

  ai.position.x += (targetX - ai.position.x) * 0.07;
  ai.position.x = Math.max(-60,Math.min(60,ai.position.x));

  if(puck.position.z < -10){
    ai.position.z += 0.06;
  } else {
    ai.position.z -= 0.03;
  }

  ai.position.z = Math.max(-40,Math.min(-5,ai.position.z));
}

// ================= RESET =================
function reset(){

  puck.position.set(0,1,0);
  vx=0;vz=0;
  hasPuck=false;

  player.position.set(0,2,35);
  ai.position.set(0,2,-35);
  goalie.position.set(0,2,-38);
}

// ================= LOOP =================
function animate(){

  requestAnimationFrame(animate);

  // ================= PLAYER MOVE (ICE FEEL) =================
  let accel = 0.75;

  if(keys["KeyA"]) player.position.x -= accel;
  if(keys["KeyD"]) player.position.x += accel;
  if(keys["KeyW"]) player.position.z -= accel;
  if(keys["KeyS"]) player.position.z += accel;

  player.position.x = Math.max(-60,Math.min(60,player.position.x));
  player.position.z = Math.max(-15,Math.min(60,player.position.z));

  // ================= PUCK PICKUP =================
  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 3.8) hasPuck = true;

  if(hasPuck){
    puck.position.x = player.position.x;
    puck.position.z = player.position.z - 2;
    puck.position.y = 1;
  } else {
    puck.position.x += vx;
    puck.position.z += vz;

    vx *= 0.96;
    vz *= 0.96;
  }

  // ================= AI =================
  aiLogic();

  // AI steal
  let dx2 = puck.position.x - ai.position.x;
  let dz2 = puck.position.z - ai.position.z;
  let dist2 = Math.sqrt(dx2*dx2 + dz2*dz2);

  if(dist2 < 3.2 && !hasPuck){
    vx = (player.position.x - ai.position.x) * 0.32;
    vz = (player.position.z - ai.position.z) * 0.32;
  }

  // ================= GOALIE (LOCKED + REACTIVE) =================
  goalie.position.x += (puck.position.x - goalie.position.x) * 0.1;
  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));
  goalie.position.z = -38;

  if(puck.position.z < -35 &&
     Math.abs(puck.position.x - goalie.position.x) < 3){
    vx *= -0.5;
  }

  // ================= GOALS =================
  if(puck.position.z < -40){
    scorePlayer++;
    document.getElementById("hud").innerText =
      `YOU ${scorePlayer} - ${scoreAI} AI`;
    reset();
  }

  if(puck.position.z > 40){
    scoreAI++;
    document.getElementById("hud").innerText =
      `YOU ${scorePlayer} - ${scoreAI} AI`;
    reset();
  }

  renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
