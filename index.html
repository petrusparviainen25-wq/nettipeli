<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hockey Stable Core</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
#hud { position:absolute; top:10px; left:10px; color:white; font-family:Arial; }
#msg { position:absolute; top:50px; left:10px; color:yellow; font-size:20px; }
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 SETUP
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.9));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL (FIXED + ALWAYS VISIBLE)
/////////////////////////////////////////////////////

function makeGoal(){

  const g = new THREE.Group();

  const mat = new THREE.MeshStandardMaterial({color:0xff0000});

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.4,4,0.4),mat);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.4,4,0.4),mat);
  const top = new THREE.Mesh(new THREE.BoxGeometry(8,0.4,0.4),mat);

  left.position.set(-4,2,-40);
  right.position.set(4,2,-40);
  top.position.set(0,4,-40);

  g.add(left,right,top);

  scene.add(g);
}

makeGoal();

/////////////////////////////////////////////////////
// 🏒 PLAYERS
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);

/////////////////////////////////////////////////////
// 🧊 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🧠 CORE STATE (IMPORTANT FIX)
/////////////////////////////////////////////////////

let owner = null; // "user" | null
let vx = 0;
let vz = 0;
let score = 0;

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys = {};
addEventListener("keydown", e => keys[e.code] = true);
addEventListener("keyup", e => keys[e.code] = false);

let mouse = {x:0,y:0};
addEventListener("mousemove", e => {
  mouse.x = (e.clientX/innerWidth - 0.5) * 2;
  mouse.y = (e.clientY/innerHeight - 0.5) * 2;
});

/////////////////////////////////////////////////////
// 🏒 PICKUP (FIXED)
/////////////////////////////////////////////////////

function pickup(){

  if(owner) return;

  const dx = puck.position.x - user.position.x;
  const dz = puck.position.z - user.position.z;

  const dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 3.5){
    owner = "user";
    vx = 0;
    vz = 0;
  }
}

/////////////////////////////////////////////////////
// 🏒 SHOOT (100% WORKING)
/////////////////////////////////////////////////////

function shoot(){

  if(owner !== "user") return;

  let dx = mouse.x;
  let dz = mouse.y;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0) return;

  vx = (dx / len) * 3.0;
  vz = (dz / len) * 3.0;

  owner = null;
}

addEventListener("mousedown", shoot);

/////////////////////////////////////////////////////
// 🤝 PASS (100% WORKING)
/////////////////////////////////////////////////////

function pass(){

  if(owner !== "user") return;

  let dx = teammate.position.x - user.position.x;
  let dz = teammate.position.z - user.position.z;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0) return;

  vx = (dx / len) * 2.5;
  vz = (dz / len) * 2.5;

  owner = null;
}

addEventListener("keydown", e => {
  if(e.code === "Space") pass();
});

/////////////////////////////////////////////////////
// 🧊 PUCK PHYSICS (STABLE)
/////////////////////////////////////////////////////

function physics(){

  if(owner === "user"){
    puck.position.x = user.position.x;
    puck.position.z = user.position.z - 2;
    puck.position.y = 1;
    return;
  }

  puck.position.x += vx;
  puck.position.z += vz;

  vx *= 0.96;
  vz *= 0.96;
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK
/////////////////////////////////////////////////////

function goal(){

  return (
    puck.position.z < -40 &&
    puck.position.x > -4 &&
    puck.position.x < 4
  );
}

/////////////////////////////////////////////////////
// 🔁 RESET
/////////////////////////////////////////////////////

function reset(){

  puck.position.set(0,1,0);
  vx = 0;
  vz = 0;
  owner = null;

  user.position.set(0,2,35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  // MOVE
  if(keys["KeyA"]) user.position.x -= 0.9;
  if(keys["KeyD"]) user.position.x += 0.9;
  if(keys["KeyW"]) user.position.z -= 0.9;
  if(keys["KeyS"]) user.position.z += 0.9;

  pickup();
  physics();

  // GOAL
  if(goal()){

    score++;

    document.getElementById("hud").innerText =
      "0 - " + score;

    document.getElementById("msg").innerText = "GOAL!";

    setTimeout(()=>{
      document.getElementById("msg").innerText = "";
    },800);

    reset();
  }

  // CAMERA
  camera.position.x += (user.position.x - camera.position.x) * 0.04;
  camera.lookAt(user.position.x, 0, 0);

  renderer.render(scene, camera);
}

loop();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
