<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL CONSOLE ENGINE</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:22px;
}
</style>
</head>
<body>

<div id="hud">SINÄ 0 - 0 AI</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

//////////////////////////////
// 🌍 WORLD + ENGINE CORE
//////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);

scene.add(new THREE.AmbientLight(0xffffff,0.7));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

//////////////////////////////
// 🎥 CONSOLE CAMERA FEEL
//////////////////////////////

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

//////////////////////////////
// 🖥️ RENDERER
//////////////////////////////

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

//////////////////////////////
// 🧊 ICE (console polish)
//////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(180,110),
  new THREE.MeshStandardMaterial({
    color:0xdff6ff,
    roughness:0.05,
    metalness:0.2
  })
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

//////////////////////////////
// 🏒 ENTITIES
//////////////////////////////

function makePlayer(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,4,8),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const player = makePlayer(0x0066ff,35);
const ai = makePlayer(0xff3333,-35);

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.5,2.5,4,8),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

//////////////////////////////
// 🎮 INPUT SYSTEM
//////////////////////////////

let keys = {};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse = {x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

//////////////////////////////
// 🧠 GAME STATE (console style)
//////////////////////////////

let vx=0,vz=0;
let hasPuck=false;
let score=0;

//////////////////////////////
// 🏒 SHOOT SYSTEM (console feel)
//////////////////////////////

addEventListener("mousedown",()=>{

  if(!hasPuck) return;

  const aimX = player.position.x + mouse.x*30;
  const aimZ = player.position.z + mouse.y*30 - 15;

  const power = 0.32;

  vx = (aimX - player.position.x) * power;
  vz = (aimZ - player.position.z) * power;

  hasPuck = false;
});

//////////////////////////////
// 🤖 AI (role-based logic)
//////////////////////////////

function aiLogic(){

  let attackMode = puck.position.z < -5;

  let targetX = attackMode ? puck.position.x : 0;

  ai.position.x += (targetX - ai.position.x)*0.06;

  ai.position.z += attackMode ? 0.06 : -0.03;

  ai.position.x = clamp(ai.position.x,-65,65);
  ai.position.z = clamp(ai.position.z,-45,-5);
}

//////////////////////////////
// 🥅 GOALIE (console AI)
//////////////////////////////

function goalieLogic(){

  const target = puck.position.x;

  goalie.position.x += (target - goalie.position.x)*0.11;
  goalie.position.x = clamp(goalie.position.x,-6,6);

  goalie.position.z = -38;
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

//////////////////////////////
// 🔁 RESET SYSTEM
//////////////////////////////

function reset(){
  puck.position.set(0,1,0);
  vx=0;vz=0;
  hasPuck=false;

  player.position.set(0,2,35);
  ai.position.set(0,2,-35);
  goalie.position.set(0,2,-38);
}

//////////////////////////////
// 🎮 CONSOLE GAME LOOP (FIXED STEP FEEL)
//////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  ////////////////////////
  // PLAYER ICE MOVEMENT
  ////////////////////////

  let speed = 0.9;

  if(keys["KeyA"]) player.position.x -= speed;
  if(keys["KeyD"]) player.position.x += speed;
  if(keys["KeyW"]) player.position.z -= speed;
  if(keys["KeyS"]) player.position.z += speed;

  player.position.x = clamp(player.position.x,-65,65);
  player.position.z = clamp(player.position.z,-20,60);

  ////////////////////////
  // PUCK PICKUP (NHL feel)
  ////////////////////////

  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx+dz*dz);

  if(dist < 3.5) hasPuck = true;

  ////////////////////////
  // PUCK PHYSICS (console tuned)
  ////////////////////////

  if(hasPuck){
    puck.position.x = player.position.x;
    puck.position.z = player.position.z - 2;
    puck.position.y = 1;
  } else {
    puck.position.x += vx;
    puck.position.z += vz;

    vx *= 0.965;
    vz *= 0.965;
  }

  ////////////////////////
  // AI + GOALIE
  ////////////////////////

  aiLogic();
  goalieLogic();

  ////////////////////////
  // SAVE SYSTEM (console reaction)
  ////////////////////////

  if(puck.position.z < -37 &&
     Math.abs(puck.position.x - goalie.position.x) < 3){
    vx *= -0.55;
  }

  ////////////////////////
  // GOAL EVENT (console style)
  ////////////////////////

  if(puck.position.z < -40){

    score++;

    document.getElementById("hud").innerText =
      "SINÄ " + score + " - AI 0";

    document.getElementById("msg").innerText = "GOAL!!!";

    setTimeout(()=>{
      document.getElementById("msg").innerText="";
    },900);

    reset();
  }

  ////////////////////////
  // CONSOLE CAMERA FEEL
  ////////////////////////

  camera.position.x += (player.position.x - camera.position.x)*0.04;
  camera.lookAt(player.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

//////////////////////////////
// 📏 RESIZE
//////////////////////////////

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
