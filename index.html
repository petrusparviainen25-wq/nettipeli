<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL PRO PELI</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
}
</style>
</head>
<body>

<div id="hud">SINÄ 0 - 0 AI</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

//////////////////////////////
// 🌍 MAAILMA
//////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);

scene.add(new THREE.AmbientLight(0xffffff,0.7));

const valo = new THREE.DirectionalLight(0xffffff,1.5);
valo.position.set(10,30,10);
scene.add(valo);

//////////////////////////////
// 🎥 KAMERA (TV-KAMERA)
//////////////////////////////

const kamera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
kamera.position.set(0,28,55);

//////////////////////////////
// 🖥️ RENDER
//////////////////////////////

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

//////////////////////////////
// 🧊 JÄÄ (parempi väri)
//////////////////////////////

const jää = new THREE.Mesh(
  new THREE.PlaneGeometry(160,100),
  new THREE.MeshStandardMaterial({
    color:0xdff6ff,
    roughness:0.05,
    metalness:0.2
  })
);
jää.rotation.x = -Math.PI/2;
scene.add(jää);

//////////////////////////////
// 🏒 PELAAJAT
//////////////////////////////

function teePelaaja(väri,z){
  const m = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,4,8),
    new THREE.MeshStandardMaterial({color:väri})
  );
  m.position.set(0,2,z);
  scene.add(m);
  return m;
}

const pelaaja = teePelaaja(0x0066ff,35);
const AI = teePelaaja(0xff3333,-35);

//////////////////////////////
// 🥅 MAAALIVAHTI
//////////////////////////////

const mv = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.5,2.5,4,8),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
mv.position.set(0,2,-38);
scene.add(mv);

//////////////////////////////
// 🏒 KIEKKO
//////////////////////////////

const kiekko = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
kiekko.rotation.x = Math.PI/2;
scene.add(kiekko);

//////////////////////////////
// 🎮 INPUT
//////////////////////////////

let näppäimet = {};
addEventListener("keydown",e=>näppäimet[e.code]=true);
addEventListener("keyup",e=>näppäimet[e.code]=false);

let hiiri = {x:0,y:0};
addEventListener("mousemove",e=>{
  hiiri.x = (e.clientX/innerWidth - 0.5)*2;
  hiiri.y = (e.clientY/innerHeight - 0.5)*2;
});

//////////////////////////////
// 🧠 PELIN TILA
//////////////////////////////

let vx = 0;
let vz = 0;
let omistus = false;
let pisteet = 0;

//////////////////////////////
// 🎯 LAUKAUS
//////////////////////////////

addEventListener("mousedown",()=>{

  if(!omistus) return;

  const kohdeX = pelaaja.position.x + hiiri.x*25;
  const kohdeZ = pelaaja.position.z + hiiri.y*25 - 15;

  vx = (kohdeX - pelaaja.position.x) * 0.35;
  vz = (kohdeZ - pelaaja.position.z) * 0.35;

  omistus = false;
});

//////////////////////////////
// 🤖 AI LOGIIKKA
//////////////////////////////

function ai(){

  AI.position.x += (kiekko.position.x - AI.position.x) * 0.06;
  AI.position.z += (kiekko.position.z < -10 ? 0.06 : -0.02);

  AI.position.x = Math.max(-60,Math.min(60,AI.position.x));
  AI.position.z = Math.max(-40,Math.min(-5,AI.position.z));
}

//////////////////////////////
// 🥅 MAAALIVAHTI
//////////////////////////////

function maalivahti(){

  mv.position.x += (kiekko.position.x - mv.position.x) * 0.1;
  mv.position.x = Math.max(-6,Math.min(6,mv.position.x));
  mv.position.z = -38;
}

//////////////////////////////
// 🔁 RESET
//////////////////////////////

function reset(){
  kiekko.position.set(0,1,0);
  vx = 0;
  vz = 0;
  omistus = false;

  pelaaja.position.set(0,2,35);
  AI.position.set(0,2,-35);
  mv.position.set(0,2,-38);
}

//////////////////////////////
// 🔄 PELISILMUKKA
//////////////////////////////

function peli(){

  requestAnimationFrame(peli);

  //////////////////////////
  // 🏃 PELAAJAN LIIKE
  //////////////////////////

  if(näppäimet["KeyA"]) pelaaja.position.x -= 0.8;
  if(näppäimet["KeyD"]) pelaaja.position.x += 0.8;
  if(näppäimet["KeyW"]) pelaaja.position.z -= 0.8;
  if(näppäimet["KeyS"]) pelaaja.position.z += 0.8;

  pelaaja.position.x = Math.max(-60,Math.min(60,pelaaja.position.x));
  pelaaja.position.z = Math.max(-15,Math.min(60,pelaaja.position.z));

  //////////////////////////
  // 🏒 KIEKON POIMINTA
  //////////////////////////

  let dx = kiekko.position.x - pelaaja.position.x;
  let dz = kiekko.position.z - pelaaja.position.z;
  let etäisyys = Math.sqrt(dx*dx+dz*dz);

  if(etäisyys < 3.5) omistus = true;

  //////////////////////////
  // 🏒 KIEKKO
  //////////////////////////

  if(omistus){
    kiekko.position.x = pelaaja.position.x;
    kiekko.position.z = pelaaja.position.z - 2;
    kiekko.position.y = 1;
  } else {
    kiekko.position.x += vx;
    kiekko.position.z += vz;

    vx *= 0.96;
    vz *= 0.96;
  }

  //////////////////////////
  // 🤖 AI
  //////////////////////////

  ai();
  maalivahti();

  //////////////////////////
  // 🥅 TORJUNTA
  //////////////////////////

  if(kiekko.position.z < -37 &&
     Math.abs(kiekko.position.x - mv.position.x) < 3){
    vx *= -0.6;
  }

  //////////////////////////
  // 🏆 MAALI
  //////////////////////////

  if(kiekko.position.z < -40){
    pisteet++;
    document.getElementById("hud").innerText =
      "MAALI! SINÄ " + pisteet;
    reset();
  }

  //////////////////////////
  // 🎥 KAMERA SEURAA
  //////////////////////////

  kamera.position.x += (pelaaja.position.x - kamera.position.x)*0.04;
  kamera.lookAt(pelaaja.position.x,0,0);

  renderer.render(scene,kamera);
}

peli();

//////////////////////////////
// 📏 RESIZE
//////////////////////////////

addEventListener("resize",()=>{
  kamera.aspect = innerWidth/innerHeight;
  kamera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
