<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hockey Movement Safe Fix</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:20px;
}
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD (UNCHANGED - NO DELETIONS)
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.9));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE (UNCHANGED)
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🧍 PLAYERS (UNCHANGED)
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);

/////////////////////////////////////////////////////
// 🧠 STATE (UNCHANGED)
/////////////////////////////////////////////////////

let controlled = "user";

function active(){
  return controlled === "user" ? user : teammate;
}

/////////////////////////////////////////////////////
// 🎮 ONLY ADDITION: MOVEMENT INPUT
/////////////////////////////////////////////////////

let keys = {};

addEventListener("keydown", e => {
  keys[e.code] = true;
});

addEventListener("keyup", e => {
  keys[e.code] = false;
});

/////////////////////////////////////////////////////
// 🎮 LOOP (ONLY MOVEMENT ADDED, NOTHING REMOVED)
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  const p = active();

  // 🧍 ONLY FIX: PLAYER MOVEMENT RESTORED
  if(keys["KeyA"]) p.position.x -= 0.9;
  if(keys["KeyD"]) p.position.x += 0.9;
  if(keys["KeyW"]) p.position.z -= 0.9;
  if(keys["KeyS"]) p.position.z += 0.9;

  camera.position.x += (p.position.x - camera.position.x)*0.04;
  camera.lookAt(p.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

</script>

</body>
</html>
