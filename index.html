<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL Mini</title>
<style>
body { margin:0; background:#0b1d2a; color:white; text-align:center; }
canvas { display:block; margin:auto; background:#e6f7ff; border:3px solid white; }
</style>
</head>
<body>

<h2>🏒 NHL Mini</h2>
<select id="mode">
  <option value="endless">Endless</option>
  <option value="time">Time Attack (60s)</option>
</select>
<button onclick="startGame()">Aloita</button>

<p>Pisteet: <span id="score">0</span> | Aika: <span id="time">60</span></p>

<canvas id="game" width="700" height="450"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, puck, goalie;
let keys = {};
let score = 0;
let time = 60;
let gameMode = "endless";
let running = false;

let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq){
  let osc = audioCtx.createOscillator();
  osc.frequency.value = freq;
  osc.connect(audioCtx.destination);
  osc.start();
  setTimeout(()=>osc.stop(),100);
}

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function startGame(){
  gameMode = document.getElementById("mode").value;

  player = { x:350, y:380, vx:0, vy:0 };
  puck = { x:350, y:250, vx:0, vy:0 };
  goalie = { x:300, y:40 };

  score = 0;
  time = 60;
  running = true;
}

function update(){

  // 🧍‍♂️ luistelu (inertia)
  if(keys["w"]) player.vy -= 0.2;
  if(keys["s"]) player.vy += 0.2;
  if(keys["a"]) player.vx -= 0.2;
  if(keys["d"]) player.vx += 0.2;

  player.vx *= 0.95;
  player.vy *= 0.95;

  player.x += player.vx;
  player.y += player.vy;

  // 🏒 dribble
  let dx = puck.x - player.x;
  let dy = puck.y - player.y;
  let dist = Math.sqrt(dx*dx + dy*dy);

  if(dist < 40){
    puck.vx += dx * -0.02;
    puck.vy += dy * -0.02;
  }

  // kiekko liike
  puck.x += puck.vx;
  puck.y += puck.vy;
  puck.vx *= 0.99;
  puck.vy *= 0.99;

  // laukaus (space)
  if(keys[" "]){
    puck.vx = (puck.x - player.x) * 0.3;
    puck.vy = -6;
    beep(400);
  }

  // 🧠 maalivahti
  let target = puck.x - 40;
  goalie.x += (target - goalie.x) * 0.04;

  // torjunta
  if(puck.y < 60 && puck.x > goalie.x && puck.x < goalie.x+80){
    puck.vy = Math.abs(puck.vy);
    puck.vx *= 0.5;
  }

  // maali
  if(puck.y < 20 && puck.x>300 && puck.x<400){
    score++;
    beep(800);

    puck.x = 350;
    puck.y = 250;
    puck.vx = 0;
    puck.vy = 0;
  }

  // time mode
  if(gameMode === "time"){
    time -= 1/60;
    if(time <= 0) running = false;
  }

  document.getElementById("score").textContent = score;
  document.getElementById("time").textContent = Math.max(0, Math.floor(time));
}

function draw(){

  // jää
  ctx.fillStyle="#e6f7ff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // viivat
  ctx.strokeStyle="red";
  ctx.beginPath();
  ctx.moveTo(0,canvas.height/2);
  ctx.lineTo(canvas.width,canvas.height/2);
  ctx.stroke();

  ctx.strokeStyle="blue";
  ctx.beginPath();
  ctx.moveTo(0,150);
  ctx.lineTo(canvas.width,150);
  ctx.stroke();

  // crease
  ctx.fillStyle="rgba(0,150,255,0.2)";
  ctx.beginPath();
  ctx.arc(350,60,40,0,Math.PI,true);
  ctx.fill();

  // maalivahti
  ctx.fillStyle="purple";
  ctx.fillRect(goalie.x,40,80,20);

  // pelaaja
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,15,0,Math.PI*2);
  ctx.fill();

  // kiekko
  ctx.beginPath();
  ctx.arc(puck.x,puck.y,8,0,Math.PI*2);
  ctx.fillStyle="black";
  ctx.fill();

  if(!running){
    ctx.fillStyle="black";
    ctx.font="40px Arial";
    ctx.fillText("GAME OVER",250,200);
  }
}

function loop(){
  if(running) update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
