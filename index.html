<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL</title>
<style>
body { margin:0; overflow:hidden; background:#87cfff; }
canvas { display:block; }

#hud{
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:20px;
}

#msg{
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:22px;
}
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,30,60);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.9));

const light = new THREE.DirectionalLight(0xffffff,1.2);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

function createGoal(){
  const g = new THREE.Group();

  const mat = new THREE.MeshStandardMaterial({color:0xff0000});

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.5,8,0.5),mat);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.5,8,0.5),mat);
  const top = new THREE.Mesh(new THREE.BoxGeometry(12,0.5,0.5),mat);

  left.position.set(-6,4,-40);
  right.position.set(6,4,-40);
  top.position.set(0,8,-40);

  g.add(left,right,top);
  scene.add(g);
}
createGoal();

/////////////////////////////////////////////////////
// 🧍 PLAYERS
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);
const ai = player(0xff3333,-30);
const defender = player(0xff7777,-15);

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.5,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🧠 STATE
/////////////////////////////////////////////////////

let owner = "free";
let controlled = "user";

let vx=0, vz=0, vy=0;

let mouse = {x:0,y:0};
let keys = {};

let score = 0;

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
  mouse.x = (e.clientX/innerWidth - 0.5)*2;
  mouse.y = (e.clientY/innerHeight - 0.5)*2;
});

/////////////////////////////////////////////////////
// 🧍 ACTIVE PLAYER
/////////////////////////////////////////////////////

function active(){
  return controlled==="user"?user:teammate;
}

/////////////////////////////////////////////////////
// 🏒 PICKUP
/////////////////////////////////////////////////////

function pickup(){
  if(owner!=="free") return;

  const p = active();
  let dx=puck.position.x-p.position.x;
  let dz=puck.position.z-p.position.z;

  if(Math.sqrt(dx*dx+dz*dz)<3.5){
    owner=controlled;
    vx=vz=vy=0;
  }
}

/////////////////////////////////////////////////////
// 🏒 SHOOT (REALISTIC + HEIGHT)
/////////////////////////////////////////////////////

function shoot(){

  if(owner !== controlled) return;
  if(lock) return;

  lock = true;

  // 🎯 direction based on mouse
  let dx = mouse.x;
  let dz = mouse.y;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ lock = false; return; }

  // 🎯 94% accuracy (small controlled error)
  const accuracy = 0.94;
  const error = (1 - accuracy);

  dx += (Math.random() - 0.5) * error * 0.8;
  dz += (Math.random() - 0.5) * error * 0.8;

  // 🏒 shot power
  const power = 3.2;

  vx = (dx / len) * power;
  vz = (dz / len) * power;

  // 🟢 height from aim (no physics break)
  vy = Math.max(0, -mouse.y * 1.6);

  owner = "free";

  setTimeout(() => lock = false, 80);
}/////////////////////////////////////////////////////
// 🤝 PASS
/////////////////////////////////////////////////////

function pass(){
  if(owner!==controlled) return;

  const t = controlled==="user"?teammate:user;

  let dx=t.position.x-active().position.x;
  let dz=t.position.z-active().position.z;

  let len=Math.sqrt(dx*dx+dz*dz);

  vx=(dx/len)*2.6;
  vz=(dz/len)*2.6;
  vy=0;

  owner="free";
  controlled=controlled==="user"?"teammate":"user";
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🧊 PHYSICS
/////////////////////////////////////////////////////

function physics(){

  if(owner!=="free"){
    const p=active();
    puck.position.x=p.position.x;
    puck.position.z=p.position.z-2;
    puck.position.y=1;
    return;
  }

  puck.position.x+=vx;
  puck.position.z+=vz;

  puck.position.y+=vy;
  vy-=0.1;

  if(puck.position.y<1){
    puck.position.y=1;
    vy=0;
  }

  vx*=0.96;
  vz*=0.96;
}

/////////////////////////////////////////////////////
// 🤖 AI
/////////////////////////////////////////////////////

function aiMove(){
  ai.position.x+=(puck.position.x-ai.position.x)*0.03;
  defender.position.x+=(puck.position.x-defender.position.x)*0.03;

  goalie.position.x+=(puck.position.x-goalie.position.x)*0.05;
  goalie.position.x=Math.max(-6,Math.min(6,goalie.position.x));
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK
/////////////////////////////////////////////////////

function goal(){
  if(puck.position.z<-40 &&
     puck.position.x>-6 &&
     puck.position.x<6){
    score++;
    document.getElementById("hud").innerText="0 - "+score;
    reset();
  }
}

function reset(){
  puck.position.set(0,1,0);
  vx=vz=vy=0;
  owner="free";
}

/////////////////////////////////////////////////////
// 🎮 MOVEMENT
/////////////////////////////////////////////////////

function movePlayer(){
  const p=active();

  if(keys["KeyA"])p.position.x-=0.9;
  if(keys["KeyD"])p.position.x+=0.9;
  if(keys["KeyW"])p.position.z-=0.9;
  if(keys["KeyS"])p.position.z+=0.9;
}

/////////////////////////////////////////////////////
// 🎥 LOOP
/////////////////////////////////////////////////////

function loop(){
  requestAnimationFrame(loop);

  movePlayer();
  pickup();
  physics();
  aiMove();
  goal();

  camera.position.x+=(active().position.x-camera.position.x)*0.05;
  camera.lookAt(active().position.x,0,0);

  renderer.render(scene,camera);
}

loop();

</script>

</body>
</html>
