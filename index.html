<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL-game</title>
<style>
body { margin:0; background:#0b1d2a; color:white; text-align:center; }
canvas { display:block; margin:auto; background:#e6f7ff; border:3px solid white; cursor: crosshair; }
</style>
</head>
<body>

<h2>🏒 NHL-tyylinen peli</h2>
<p>Liiku ← → | Tähtää hiirellä | Pidä klikkaus = voimakkaampi laukaus</p>
<p>Pisteet: <span id="score">0</span></p>

<canvas id="game" width="700" height="450"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = { x: 350, y: 380 };
let puck = { x: 350, y: 250, vx: 0, vy: 0, r: 8 };

let goalie = { x: 300, y: 40, w: 100, h: 20 };

let score = 0;

let mouse = { x:0, y:0 };
let charging = false;
let power = 0;

canvas.addEventListener("mousemove", e=>{
  let rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", ()=>{
  charging = true;
  power = 0;
});

canvas.addEventListener("mouseup", ()=>{
  charging = false;

  let dx = mouse.x - puck.x;
  let dy = mouse.y - puck.y;
  let len = Math.sqrt(dx*dx + dy*dy);

  puck.vx = (dx/len) * power;
  puck.vy = (dy/len) * power;
});

function drawRink(){
  ctx.fillStyle="#e6f7ff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // keskiviiva
  ctx.strokeStyle="red";
  ctx.beginPath();
  ctx.moveTo(0,canvas.height/2);
  ctx.lineTo(canvas.width,canvas.height/2);
  ctx.stroke();

  // siniviivat
  ctx.strokeStyle="blue";
  ctx.beginPath();
  ctx.moveTo(0,150);
  ctx.lineTo(canvas.width,150);
  ctx.stroke();

  // aloituspiste
  ctx.beginPath();
  ctx.arc(canvas.width/2,canvas.height/2,30,0,Math.PI*2);
  ctx.stroke();

  // maalialue
  ctx.fillStyle="rgba(0,150,255,0.2)";
  ctx.beginPath();
  ctx.arc(canvas.width/2,60,40,0,Math.PI,true);
  ctx.fill();
}

function update(){
  puck.x += puck.vx;
  puck.y += puck.vy;

  // kitka
  puck.vx *= 0.99;
  puck.vy *= 0.99;

  // seinät
  if(puck.x<0||puck.x>canvas.width) puck.vx*=-1;
  if(puck.y<0||puck.y>canvas.height) puck.vy*=-1;

  // maila osuma (jos lähellä pelaajaa)
  let dx = puck.x - player.x;
  let dy = puck.y - player.y;
  if(Math.sqrt(dx*dx+dy*dy)<25){
    puck.vy = -Math.abs(puck.vy);
  }

  // 🧠 maalivahti viiveellä
  let target = puck.x - goalie.w/2;
  goalie.x += (target - goalie.x) * 0.03;

  // torjunta
  if(
    puck.y - puck.r < goalie.y + goalie.h &&
    puck.x > goalie.x &&
    puck.x < goalie.x + goalie.w
  ){
    puck.vy = Math.abs(puck.vy);
  }

  // maali
  if(puck.y < 20 && puck.x>300 && puck.x<400){
    score++;
    document.getElementById("score").textContent = score;

    puck.x = 350;
    puck.y = 250;
    puck.vx = 0;
    puck.vy = 0;
  }

  // lataus
  if(charging){
    power += 0.2;
    if(power > 10) power = 10;
  }
}

function draw(){
  drawRink();

  // tähtäysviiva
  if(charging){
    ctx.strokeStyle="rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.moveTo(puck.x,puck.y);
    ctx.lineTo(mouse.x,mouse.y);
    ctx.stroke();
  }

  // pelaaja
  ctx.fillStyle="blue";
  ctx.beginPath();
  ctx.arc(player.x,player.y,15,0,Math.PI*2);
  ctx.fill();

  // maila
  ctx.strokeStyle="black";
  ctx.beginPath();
  ctx.moveTo(player.x,player.y);
  ctx.lineTo(mouse.x,mouse.y);
  ctx.stroke();

  // maalivahti
  ctx.fillStyle="purple";
  ctx.fillRect(goalie.x,goalie.y,goalie.w,goalie.h);

  // kiekko
  ctx.beginPath();
  ctx.arc(puck.x,puck.y,puck.r,0,Math.PI*2);
  ctx.fillStyle="black";
  ctx.fill();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
