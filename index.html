<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL V13 FULL</title>
<style>
body { margin:0; overflow:hidden; background:#87cfff; }
canvas { display:block; }
#score{
 position:absolute;
 top:10px;
 left:10px;
 color:white;
 font-family:Arial;
 font-size:22px;
}
</style>
</head>
<body>

<div id="score">0 - 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🧠 SAFE STATE
/////////////////////////////////////////////////////

let scene, camera, renderer;

let puck, user, team, ai1, ai2, goalie;

let vx=0, vz=0, vy=0;
let velX=0, velZ=0;

let keys={};
let mouse={x:0,y:0};

let controlled="user";
let puckOwner=null;

let score=0;

/////////////////////////////////////////////////////
// INIT SAFE (NO WHITE SCREEN)
/////////////////////////////////////////////////////

function init(){

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,25,60);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// lights
scene.add(new THREE.AmbientLight(0xffffff,1.2));

let light = new THREE.DirectionalLight(0xffffff,1.3);
light.position.set(10,30,10);
scene.add(light);

// world
ice();
boards();
goal();
players();
puckObj();

}

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

function ice(){
 let g = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
 );
 g.rotation.x = -Math.PI/2;
 scene.add(g);
}

/////////////////////////////////////////////////////
// 🧱 BOARDS
/////////////////////////////////////////////////////

function boards(){

 let m = new THREE.MeshStandardMaterial({color:0xffffff});

 let a = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 let b = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 let c = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);
 let d = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);

 a.position.set(-100,1.5,0);
 b.position.set(100,1.5,0);
 c.position.set(0,1.5,-60);
 d.position.set(0,1.5,60);

 scene.add(a,b,c,d);
}

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

function goal(){

 let m = new THREE.MeshStandardMaterial({color:0xff0000});

 let l = new THREE.Mesh(new THREE.BoxGeometry(0.5,10,0.5),m);
 let r = new THREE.Mesh(new THREE.BoxGeometry(0.5,10,0.5),m);
 let t = new THREE.Mesh(new THREE.BoxGeometry(14,0.5,0.5),m);

 l.position.set(-7,5,-40);
 r.position.set(7,5,-40);
 t.position.set(0,10,-40);

 scene.add(l,r,t);
}

/////////////////////////////////////////////////////
// 🧍 PLAYER
/////////////////////////////////////////////////////

function player(color,x,z){

 let g = new THREE.Group();

 let body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9,1.1,3.5,10),
  new THREE.MeshStandardMaterial({color})
 );

 let head = new THREE.Mesh(
  new THREE.SphereGeometry(0.7,12,12),
  new THREE.MeshStandardMaterial({color:0xffe0bd})
 );

 body.position.y = 2;
 head.position.y = 4.2;

 g.add(body);
 g.add(head);

 g.position.set(x,0,z);
 scene.add(g);

 return g;
}

/////////////////////////////////////////////////////
// PLAYERS
/////////////////////////////////////////////////////

function players(){
 user = player(0x0066ff,0,30);
 team = player(0x3399ff,6,30);
 ai1 = player(0xff4444,-5,-20);
 ai2 = player(0xff7777,5,-25);
 goalie = player(0xffffff,0,-38);
}

/////////////////////////////////////////////////////
// PUCK
/////////////////////////////////////////////////////

function puckObj(){

 puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
 );

 puck.rotation.x = Math.PI/2;
 puck.position.set(0,1,0);

 scene.add(puck);
}

/////////////////////////////////////////////////////
// INPUT
/////////////////////////////////////////////////////

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
 mouse.x = (e.clientX/innerWidth - 0.5)*2;
 mouse.y = (e.clientY/innerHeight - 0.5)*2;
});

/////////////////////////////////////////////////////
// ACTIVE PLAYER
/////////////////////////////////////////////////////

function active(){
 return controlled==="user"?user:team;
}

/////////////////////////////////////////////////////
// MOVE
/////////////////////////////////////////////////////

function move(){

 let p = active();
 if(!p) return;

 let acc = 0.12;

 if(keys["KeyA"]) velX -= acc;
 if(keys["KeyD"]) velX += acc;
 if(keys["KeyW"]) velZ -= acc;
 if(keys["KeyS"]) velZ += acc;

 velX *= 0.88;
 velZ *= 0.88;

 p.position.x += velX;
 p.position.z += velZ;
}

/////////////////////////////////////////////////////
// PICKUP
/////////////////////////////////////////////////////

function pickup(){

 let p = active();
 if(!p || !puck) return;

 let dx = puck.position.x - p.position.x;
 let dz = puck.position.z - p.position.z;

 if(Math.hypot(dx,dz) < 3.5){
  puckOwner = controlled;
 }

 if(puckOwner === controlled){
  puck.position.x += (p.position.x - puck.position.x)*0.35;
  puck.position.z += (p.position.z - puck.position.z)*0.35;
  puck.position.y = 1;
 }
}

/////////////////////////////////////////////////////
// SHOOT
/////////////////////////////////////////////////////

function shoot(){

 let p = active();
 if(!p || !puck) return;

 let dx = mouse.x;
 let dz = mouse.y;

 let len = Math.hypot(dx,dz);
 if(len < 0.001){ dx = 0; dz = -1; len = 1; }

 dx /= len;
 dz /= len;

 vx = dx * 5.2;
 vz = dz * 5.2;
 vy = Math.max(0, -mouse.y * 2.2);

 puckOwner = null;
}

addEventListener("mousedown",shoot);

/////////////////////////////////////////////////////
// PASS
/////////////////////////////////////////////////////

function pass(){

 let p = active();
 if(!p || !puck) return;

 let t = controlled==="user"?team:user;

 let dx = t.position.x - p.position.x;
 let dz = t.position.z - p.position.z;

 let len = Math.hypot(dx,dz);
 if(len < 0.001) return;

 dx /= len;
 dz /= len;

 vx = dx * 3.8;
 vz = dz * 3.8;
 vy = 0;

 puckOwner = null;

 controlled = controlled==="user"?"team":"user";
}

addEventListener("keydown",e=>{
 if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// PHYSICS
/////////////////////////////////////////////////////

function physics(){

 if(!puck) return;

 if(puckOwner === null){

  puck.position.x += vx;
  puck.position.z += vz;
  puck.position.y += vy;

  vy -= 0.08;

  if(puck.position.y < 1){
   puck.position.y = 1;
   vy = 0;
  }

  vx *= 0.96;
  vz *= 0.96;
 }
}

/////////////////////////////////////////////////////
// GOAL
/////////////////////////////////////////////////////

function goal(){

 if(!puck) return;

 if(puck.position.z < -40 &&
    puck.position.x > -7 &&
    puck.position.x < 7){

  score++;
  document.getElementById("score").innerText = score + " - 0";

  puck.position.set(0,1,0);
  vx = vz = vy = 0;
  puckOwner = null;
 }
}

/////////////////////////////////////////////////////
// CAMERA
/////////////////////////////////////////////////////

function cam(){

 let p = active();
 if(!p || !camera) return;

 camera.position.x += (p.position.x - camera.position.x)*0.08;
 camera.position.z += (p.position.z + 25 - camera.position.z)*0.08;

 camera.lookAt(p.position.x,0,p.position.z);
}

/////////////////////////////////////////////////////
// LOOP SAFE
/////////////////////////////////////////////////////

function loop(){

 requestAnimationFrame(loop);

 try{
  move();
  pickup();
  physics();
  goal();
  cam();
 }catch(e){
  console.log("error",e);
 }

 if(renderer && scene && camera){
  renderer.render(scene,camera);
 }
}

init();
loop();

</script>

</body>
</html>
