<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL Engine FIXED FULL</title>

<style>
body { margin:0; overflow:hidden; background:#87cfff; }
canvas { display:block; }

#hud{
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:20px;
  z-index:10;
}
</style>
</head>
<body>

<div id="hud">0 - 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD (FIXED CAMERA VISIBILITY)
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  0.1,
  1000
);

// 🟢 FIX: proper offset camera (was broken before)
camera.position.set(0, 25, 60);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 💡 LIGHTS (IMPORTANT FIX)
/////////////////////////////////////////////////////

scene.add(new THREE.AmbientLight(0xffffff, 1));

const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(10, 30, 10);
scene.add(light);

/////////////////////////////////////////////////////
// 🧊 ICE (VISIBLE FIX)
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 120),
  new THREE.MeshStandardMaterial({ color:0xdff6ff })
);
ice.rotation.x = -Math.PI / 2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

function createGoal(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0xff0000 });

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.5,8,0.5),mat);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.5,8,0.5),mat);
  const top = new THREE.Mesh(new THREE.BoxGeometry(12,0.5,0.5),mat);

  left.position.set(-6,4,-40);
  right.position.set(6,4,-40);
  top.position.set(0,8,-40);

  g.add(left,right,top);
  scene.add(g);
}
createGoal();

/////////////////////////////////////////////////////
// 🧍 PLAYERS (VISIBLE FIX)
/////////////////////////////////////////////////////

function player(color,x,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({ color })
  );
  p.position.set(x,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff, 0, 30);
const teammate = player(0x3399ff, 6, 30);

const ai = player(0xff3333, -5, -20);
const defender = player(0xff7777, 5, -15);

/////////////////////////////////////////////////////
// 🥅 GOALIE (FIXED POSITION)
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.5,6,10),
  new THREE.MeshStandardMaterial({ color:0xffffff })
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PUCK (FORCED VISIBLE HEIGHT)
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({ color:0x000000 })
);
puck.rotation.x = Math.PI / 2;
puck.position.set(0,1,0);
scene.add(puck);

/////////////////////////////////////////////////////
// 🧠 STATE
/////////////////////////////////////////////////////

let owner = "free";
let controlled = "user";

let vx=0, vz=0, vy=0;

let mouse = {x:0,y:0};
let keys = {};

let score = 0;
let lock = false;

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

window.addEventListener("keydown",e=>keys[e.code]=true);
window.addEventListener("keyup",e=>keys[e.code]=false);

window.addEventListener("mousemove",e=>{
  mouse.x = (e.clientX / innerWidth - 0.5) * 2;
  mouse.y = (e.clientY / innerHeight - 0.5) * 2;
});

/////////////////////////////////////////////////////
// 🧍 ACTIVE PLAYER
/////////////////////////////////////////////////////

function active(){
  return controlled === "user" ? user : teammate;
}

/////////////////////////////////////////////////////
// 🧍 MOVEMENT
/////////////////////////////////////////////////////

function move(){
  const p = active();

  if(keys["KeyA"]) p.position.x -= 0.9;
  if(keys["KeyD"]) p.position.x += 0.9;
  if(keys["KeyW"]) p.position.z -= 0.9;
  if(keys["KeyS"]) p.position.z += 0.9;
}

/////////////////////////////////////////////////////
// 🏒 PICKUP
/////////////////////////////////////////////////////

function pickup(){
  if(owner !== "free") return;

  const p = active();

  let dx = puck.position.x - p.position.x;
  let dz = puck.position.z - p.position.z;

  if(Math.sqrt(dx*dx + dz*dz) < 3.5){
    owner = controlled;
    vx = vz = vy = 0;
  }
}

/////////////////////////////////////////////////////
// 🏒 SHOOT (FIXED + VISIBLE SAFE)
/////////////////////////////////////////////////////

function shoot(){
  if(owner !== controlled) return;
  if(lock) return;

  lock = true;

  let dx = mouse.x;
  let dz = mouse.y;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){
    dx = 0;
    dz = -1;
    len = 1;
  }

  const err = 0.06;

  dx += (Math.random()-0.5)*err;
  dz += (Math.random()-0.5)*err;

  vx = (dx/len)*3.2;
  vz = (dz/len)*3.2;

  vy = Math.max(0, -mouse.y * 1.8);

  owner = "free";

  setTimeout(()=>lock=false,60);
}

window.addEventListener("mousedown",shoot);

/////////////////////////////////////////////////////
// 🧊 PHYSICS
/////////////////////////////////////////////////////

function physics(){

  if(owner !== "free"){
    const p = active();
    puck.position.x = p.position.x;
    puck.position.z = p.position.z - 2;
    puck.position.y = 1;
    return;
  }

  puck.position.x += vx;
  puck.position.z += vz;
  puck.position.y += vy;

  vy -= 0.1;

  if(puck.position.y < 1){
    puck.position.y = 1;
    vy = 0;
  }

  vx *= 0.96;
  vz *= 0.96;

  // goalie block
  if(
    puck.position.z < -37 &&
    Math.abs(puck.position.x - goalie.position.x) < 2.2
  ){
    vx *= -0.4;
    vz *= 0.4;
    vy = 2;
  }
}

/////////////////////////////////////////////////////
// 🤖 AI
/////////////////////////////////////////////////////

function aiMove(){

  ai.position.x += (puck.position.x - ai.position.x) * 0.03;
  defender.position.x += (puck.position.x - defender.position.x) * 0.03;

  goalie.position.x += (puck.position.x - goalie.position.x) * 0.05;
  goalie.position.x = Math.max(-6, Math.min(6, goalie.position.x));
}

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

function goal(){

  if(
    puck.position.z < -40 &&
    Math.abs(puck.position.x) < 6
  ){
    score++;
    document.getElementById("hud").innerText = "0 - " + score;
    reset();
  }
}

function reset(){
  puck.position.set(0,1,0);
  vx = vz = vy = 0;
  owner = "free";
}

/////////////////////////////////////////////////////
// 🎥 CAMERA FIX (IMPORTANT)
/////////////////////////////////////////////////////

function updateCamera(){
  const p = active();

  camera.position.x += (p.position.x - camera.position.x) * 0.08;
  camera.position.z += (p.position.z + 25 - camera.position.z) * 0.08;

  camera.lookAt(p.position.x, 0, p.position.z - 10);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  move();
  pickup();
  physics();
  aiMove();
  goal();
  updateCamera();

  renderer.render(scene, camera);
}

loop();

</script>

</body>
</html>
