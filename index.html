<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Minipeli</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
    }

    #gameArea {
      position: relative;
      width: 100%;
      height: 80vh;
      background: #222;
      overflow: hidden;
    }

    #box {
      position: absolute;
      width: 50px;
      height: 50px;
      background: lime;
      cursor: pointer;
    }

    #score {
      font-size: 24px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Klikkauspeli</h1>
<div id="score">Pisteet: 0</div>
<button onclick="startGame()">Aloita peli</button>

<div id="gameArea">
  <div id="box"></div>
</div>

<script>
  let score = 0;
  let gameRunning = false;
  const box = document.getElementById("box");
  const scoreText = document.getElementById("score");

  function randomPosition() {
    const area = document.getElementById("gameArea");
    const maxX = area.clientWidth - 50;
    const maxY = area.clientHeight - 50;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    box.style.left = x + "px";
    box.style.top = y + "px";
  }

  function startGame() {
    score = 0;
    gameRunning = true;
    scoreText.textContent = "Pisteet: 0";
    randomPosition();

    moveLoop();
  }

  function moveLoop() {
    if (!gameRunning) return;

    randomPosition();

    setTimeout(moveLoop, 800); // nopeus (pienempi = vaikeampi)
  }

  box.addEventListener("click", () => {
    if (!gameRunning) return;

    score++;
    scoreText.textContent = "Pisteet: " + score;

    randomPosition();
  });
</script>

</body>
</html>
