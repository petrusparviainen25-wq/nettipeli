<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Jääkiekko peli</title>
<style>
  body {
    margin: 0;
    background: #0b1d2a;
    color: white;
    text-align: center;
    font-family: Arial;
  }

  canvas {
    background: #e6f7ff;
    display: block;
    margin: auto;
    border: 3px solid white;
  }
</style>
</head>
<body>

<h2>🏒 Jääkiekko</h2>
<p>Liiku ← → | Lyö SPACE</p>
<p>Pisteet: <span id="score">0</span></p>

<canvas id="game" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x: 280,
  y: 330,
  width: 40,
  height: 20,
  speed: 5
};

let puck = {
  x: 300,
  y: 200,
  radius: 10,
  vx: 2,
  vy: 2
};

let goal = {
  x: 250,
  y: 0,
  width: 100,
  height: 10
};

let score = 0;
let keys = {};

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

function update() {
  // liike
  if (keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["ArrowRight"]) player.x += player.speed;

  // rajat
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

  // kiekko liike
  puck.x += puck.vx;
  puck.y += puck.vy;

  // seinät
  if (puck.x < 0 || puck.x > canvas.width) puck.vx *= -1;
  if (puck.y < 0 || puck.y > canvas.height) puck.vy *= -1;

  // maila osuma
  if (
    puck.y + puck.radius > player.y &&
    puck.x > player.x &&
    puck.x < player.x + player.width
  ) {
    puck.vy = -Math.abs(puck.vy);
  }

  // maali
  if (
    puck.y - puck.radius <= goal.y + goal.height &&
    puck.x > goal.x &&
    puck.x < goal.x + goal.width
  ) {
    score++;
    document.getElementById("score").textContent = score;

    // reset
    puck.x = 300;
    puck.y = 200;
  }

  // lyönti
  if (keys["Space"]) {
    if (Math.abs(puck.y - player.y) < 30) {
      puck.vy = -5;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // jää
  ctx.fillStyle = "#e6f7ff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // maali
  ctx.fillStyle = "red";
  ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

  // pelaaja
  ctx.fillStyle = "blue";
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // kiekko
  ctx.beginPath();
  ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
  ctx.fillStyle = "black";
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
