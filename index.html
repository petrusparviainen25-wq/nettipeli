<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL SHOT POWER FULL</title>
<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,25,60);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.2));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

const goal = new THREE.Group();
const mat = new THREE.MeshStandardMaterial({color:0xff0000});

const l = new THREE.Mesh(new THREE.BoxGeometry(0.5,8,0.5),mat);
const r = new THREE.Mesh(new THREE.BoxGeometry(0.5,8,0.5),mat);
const t = new THREE.Mesh(new THREE.BoxGeometry(12,0.5,0.5),mat);

l.position.set(-6,4,-40);
r.position.set(6,4,-40);
t.position.set(0,8,-40);

goal.add(l,r,t);
scene.add(goal);

/////////////////////////////////////////////////////
// 🧍 PLAYERS
/////////////////////////////////////////////////////

function player(c,x,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color:c})
  );
  p.position.set(x,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,0,30);
const team = player(0x3399ff,6,30);

const ai1 = player(0xff3333,-5,-20);
const ai2 = player(0xff7777,5,-15);

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.5,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
puck.position.set(0,1,0);
scene.add(puck);

/////////////////////////////////////////////////////
// 🧠 STATE
/////////////////////////////////////////////////////

let vx=0,vz=0,vy=0;

let mouse={x:0,y:0};
let keys={};

let controlled="user";

let pressTime=0;

/////////////////////////////////////////////////////
// INPUT
/////////////////////////////////////////////////////

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// ACTIVE PLAYER
/////////////////////////////////////////////////////

function active(){
  return controlled==="user"?user:team;
}

/////////////////////////////////////////////////////
// MOVE
/////////////////////////////////////////////////////

function move(){
  const p=active();

  if(keys["KeyA"])p.position.x-=0.8;
  if(keys["KeyD"])p.position.x+=0.8;
  if(keys["KeyW"])p.position.z-=0.8;
  if(keys["KeyS"])p.position.z+=0.8;
}

/////////////////////////////////////////////////////
// PUCK CHECK
/////////////////////////////////////////////////////

function hasPuck(){
  const p=active();
  let dx=puck.position.x-p.position.x;
  let dz=puck.position.z-p.position.z;
  return Math.sqrt(dx*dx+dz*dz)<3.5;
}

function pickup(){
  if(!hasPuck()) return;
  const p=active();

  puck.position.x=p.position.x;
  puck.position.z=p.position.z-2;
  puck.position.y=1;
}

/////////////////////////////////////////////////////
// 🏒 SHOOT (POWER SYSTEM)
/////////////////////////////////////////////////////

function shoot(){

  if(!hasPuck()) return;

  const p = active();

  let dx = mouse.x;
  let dz = mouse.y;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){
    dx = 0;
    dz = -1;
    len = 1;
  }

  // 🎯 pieni NHL-tason hajonta (ei arcade spread)
  const accuracy = 0.02;

  dx += (Math.random()-0.5) * accuracy;
  dz += (Math.random()-0.5) * accuracy;

  // 🏒 SUORA VELOCITY (EI pomppua)
  const basePower = 4.2;

  vx = (dx / len) * basePower;
  vz = (dz / len) * basePower;

  // 🧊 TÄRKEÄ FIX: poistetaan “hyppy”
  vy = 0;

  // puck pysyy jäässä laukauksen alussa
  puck.position.y = 1;
}
/////////////////////////////////////////////////////
// PASS
/////////////////////////////////////////////////////

function pass(){

  if(!hasPuck()) return;

  const t = controlled==="user"?team:user;

  let dx=t.position.x-active().position.x;
  let dz=t.position.z-active().position.z;

  let len=Math.sqrt(dx*dx+dz*dz);

  vx=(dx/len)*2.5;
  vz=(dz/len)*2.5;
  vy=0;

  controlled = controlled==="user"?"team":"user";
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// PHYSICS
/////////////////////////////////////////////////////

function physics(){

  puck.position.x+=vx;
  puck.position.z+=vz;
  puck.position.y+=vy;

  vy-=0.1;

  if(puck.position.y<1){
    puck.position.y=1;
    vy=0;
  }

  vx*=0.96;
  vz*=0.96;

  // 🥅 goalie movement + block
  goalie.position.x += (puck.position.x - goalie.position.x)*0.06;
  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));

  if(
    puck.position.z<-37 &&
    Math.abs(puck.position.x-goalie.position.x)<2.3
  ){
    vx*=-0.3;
    vz*=0.3;
    vy=2;
  }
}

/////////////////////////////////////////////////////
// AI
/////////////////////////////////////////////////////

function ai(){
  ai1.position.x+=(puck.position.x-ai1.position.x)*0.03;
  ai2.position.x+=(puck.position.x-ai2.position.x)*0.03;
}

/////////////////////////////////////////////////////
// CAMERA
/////////////////////////////////////////////////////

function cam(){
  const p=active();

  camera.position.x+=(p.position.x-camera.position.x)*0.08;
  camera.position.z+=(p.position.z+25-camera.position.z)*0.08;

  camera.lookAt(p.position.x,0,p.position.z-10);
}

/////////////////////////////////////////////////////
// LOOP
/////////////////////////////////////////////////////

function loop(){
  requestAnimationFrame(loop);

  move();
  pickup();
  physics();
  ai();
  cam();

  renderer.render(scene,camera);
}

loop();

</script>

</body>
</html>
