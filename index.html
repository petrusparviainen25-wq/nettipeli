<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NHL V8 AAA ENGINE</title>
<style>
body{margin:0;overflow:hidden;background:#000;}
canvas{display:block;}
#hud{position:absolute;top:10px;left:10px;color:#fff;font-family:Arial;}
#msg{position:absolute;top:50px;left:10px;color:yellow;font-size:20px;}
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.8));
const light = new THREE.DirectionalLight(0xffffff,1.6);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🎥 CAMERA
/////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🏒 ENTITIES
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);
const ai = player(0xff3333,-35);
const defender = player(0xff7777,-20);

/////////////////////////////////////////////////////
// 🥅 GOALIE (REAL STATE MACHINE)
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

let goalieState = "idle";

/////////////////////////////////////////////////////
// 🏒 PUCK SYSTEM (IMPORTANT FIX)
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

let owner = null; // "user" | "ai" | null

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse={x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// 🧠 PHYSICS
/////////////////////////////////////////////////////

let vx=0,vz=0;
let score=0;

/////////////////////////////////////////////////////
// 🏒 TAKE PUCK (FIXED OWNERSHIP)
/////////////////////////////////////////////////////

function checkPickup(){

  if(owner !== null) return;

  const dx = puck.position.x - user.position.x;
  const dz = puck.position.z - user.position.z;

  const d = Math.sqrt(dx*dx+dz*dz);

  if(d < 3.5){
    owner = "user";
  }
}

/////////////////////////////////////////////////////
// 🏒 SHOOT (REAL RELEASE SYSTEM)
/////////////////////////////////////////////////////

function shoot(){

  if(owner !== "user") return;

  const dx = mouse.x;
  const dz = mouse.y;

  const len = Math.sqrt(dx*dx + dz*dz);

  vx = (dx/len)*2.8;
  vz = (dz/len)*2.8;

  owner = null;
}

addEventListener("mousedown", shoot);

/////////////////////////////////////////////////////
// 🤝 PASS (FIXED TARGET)
/////////////////////////////////////////////////////

function pass(){

  if(owner !== "user") return;

  const dx = teammate.position.x - user.position.x;
  const dz = teammate.position.z - user.position.z;

  const len = Math.sqrt(dx*dx + dz*dz);

  vx = (dx/len)*2.4;
  vz = (dz/len)*2.4;

  owner = null;
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🧊 PUCK LOGIC
/////////////////////////////////////////////////////

function puckSystem(){

  if(owner === "user"){
    puck.position.x = user.position.x;
    puck.position.z = user.position.z - 2;
    puck.position.y = 1;
  }

  if(owner === null){
    puck.position.x += vx;
    puck.position.z += vz;

    vx *= 0.96;
    vz *= 0.96;
  }
}

/////////////////////////////////////////////////////
// 🤖 AI (TACTICS LAYER)
/////////////////////////////////////////////////////

function aiBrain(){

  if(owner === null){

    defender.position.x += (puck.position.x - defender.position.x)*0.06;
    ai.position.x += (puck.position.x - ai.position.x)*0.05;
  }
}

/////////////////////////////////////////////////////
// 🥅 GOALIE STATE MACHINE
/////////////////////////////////////////////////////

function goalieAI(){

  const target = puck.position.x + vx*6;

  goalie.position.x += (target - goalie.position.x)*0.12;

  if(Math.abs(target - goalie.position.x) > 4){
    goalieState = "dive";
  } else {
    goalieState = "track";
  }

  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK
/////////////////////////////////////////////////////

function goal(){

  return (
    puck.position.z < -40 &&
    puck.position.x > -3.7 &&
    puck.position.x < 3.7
  );
}

/////////////////////////////////////////////////////
// 🔁 RESET
/////////////////////////////////////////////////////

function reset(){

  puck.position.set(0,1,0);
  vx=0;vz=0;
  owner=null;

  user.position.set(0,2,35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  /////////////////////////////////////////////////////
  // MOVE
  /////////////////////////////////////////////////////

  if(keys["KeyA"]) user.position.x -= 0.9;
  if(keys["KeyD"]) user.position.x += 0.9;
  if(keys["KeyW"]) user.position.z -= 0.9;
  if(keys["KeyS"]) user.position.z += 0.9;

  checkPickup();

  puckSystem();
  aiBrain();
  goalieAI();

  /////////////////////////////////////////////////////
  // GOAL
  /////////////////////////////////////////////////////

  if(goal()){

    score++;

    document.getElementById("hud").innerText =
      "0 - "+score;

    document.getElementById("msg").innerText="GOAL!";

    setTimeout(()=>document.getElementById("msg").innerText="",800);

    reset();
  }

  camera.position.x += (user.position.x-camera.position.x)*0.04;
  camera.lookAt(user.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
