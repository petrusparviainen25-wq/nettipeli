<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL SAFE V10</title>
<style>
body { margin:0; overflow:hidden; background:#87cfff; }
canvas { display:block; }
#score{
 position:absolute;
 top:10px;
 left:10px;
 color:white;
 font-family:Arial;
 font-size:22px;
}
</style>
</head>
<body>

<div id="score">0 - 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🧠 SAFE GLOBAL STATE (ANTI-BLUE SCREEN)
/////////////////////////////////////////////////////

let scene = null;
let camera = null;
let renderer = null;

let puck=null,user=null,team=null,ai1=null,ai2=null,goalie=null;

let vx=0,vz=0,vy=0;
let velX=0,velZ=0;

let mouse={x:0,y:0};
let keys={};
let controlled="user";

let passTimer=0;
let score=0;

let puckOwner=null;

let stickOffsetX=0;
let stickOffsetZ=0;

let scrambleTimer=0;
let scrambleOwner=null;

let goalieState="ready";
let goalieAnimT=0;

/////////////////////////////////////////////////////
// 🧯 SAFE INIT WRAPPER (NO CRASH GUARANTEE)
/////////////////////////////////////////////////////

function init(){

try{

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,25,60);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// lights
scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light = new THREE.DirectionalLight(0xffffff,1.3);
light.position.set(10,30,10);
scene.add(light);

// world
ice();
boards();
goal();
players();
puckObj();

}catch(e){
 console.log("INIT ERROR:",e);
}

}

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

function ice(){
 const m=new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
 );
 m.rotation.x=-Math.PI/2;
 scene.add(m);
}

/////////////////////////////////////////////////////
// 🧱 BOARDS
/////////////////////////////////////////////////////

function boards(){

 const m=new THREE.MeshStandardMaterial({color:0xffffff});

 const a=new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const b=new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const c=new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);
 const d=new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);

 a.position.set(-100,1.5,0);
 b.position.set(100,1.5,0);
 c.position.set(0,1.5,-60);
 d.position.set(0,1.5,60);

 scene.add(a,b,c,d);
}

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

function goal(){

 const m=new THREE.MeshStandardMaterial({color:0xff0000});

 const l=new THREE.Mesh(new THREE.BoxGeometry(0.5,10,0.5),m);
 const r=new THREE.Mesh(new THREE.BoxGeometry(0.5,10,0.5),m);
 const t=new THREE.Mesh(new THREE.BoxGeometry(14,0.5,0.5),m);

 l.position.set(-7,5,-40);
 r.position.set(7,5,-40);
 t.position.set(0,10,-40);

 scene.add(l,r,t);
}

/////////////////////////////////////////////////////
// 🧍 REALISTIC PLAYERS
/////////////////////////////////////////////////////

function player(color,x,z){

 const g=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.CylinderGeometry(0.9,1.1,3.5,10),
  new THREE.MeshStandardMaterial({color})
 );

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.7,12,12),
  new THREE.MeshStandardMaterial({color:0xffe0bd})
 );

 const stick=new THREE.Mesh(
  new THREE.BoxGeometry(0.2,0.2,3),
  new THREE.MeshStandardMaterial({color:0x222222})
 );

 body.position.y=2;
 head.position.y=4.2;
 stick.position.set(0.8,1.2,1.5);
 stick.rotation.x=0.4;

 g.add(body);
 g.add(head);
 g.add(stick);

 g.position.set(x,0,z);

 scene.add(g);
 return g;
}

function players(){
 user=player(0x0066ff,0,30);
 team=player(0x3399ff,6,30);
 ai1=player(0xff4444,-5,-20);
 ai2=player(0xff7777,5,-25);
 goalie=player(0xffffff,0,-38);
}

/////////////////////////////////////////////////////
// 🏒 PUCK
/////////////////////////////////////////////////////

function puckObj(){

 puck=new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
 );

 puck.rotation.x=Math.PI/2;
 puck.position.set(0,1,0);

 scene.add(puck);
}

/////////////////////////////////////////////////////
// INPUT SAFE
/////////////////////////////////////////////////////

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
 mouse.x=(e.clientX/innerWidth-0.5)*2;
 mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// ACTIVE PLAYER
/////////////////////////////////////////////////////

function active(){
 return controlled==="user"?user:team;
}

/////////////////////////////////////////////////////
// MOVE (REALISTIC SKATE)
/////////////////////////////////////////////////////

function move(){

 if(!active()) return;

 const p=active();

 let acc=0.12;

 if(keys["KeyA"]) velX-=acc;
 if(keys["KeyD"]) velX+=acc;
 if(keys["KeyW"]) velZ-=acc;
 if(keys["KeyS"]) velZ+=acc;

 velX*=0.88;
 velZ*=0.88;

 p.position.x+=velX;
 p.position.z+=velZ;

 p.rotation.z=-velX*0.2;
 p.rotation.x=velZ*0.15;
}

/////////////////////////////////////////////////////
// HAS PUCK
/////////////////////////////////////////////////////

function hasPuck(){
 const p=active();
 return p && Math.hypot(puck.position.x-p.position.x,puck.position.z-p.position.z)<3;
}

/////////////////////////////////////////////////////
// STICK + SCRAMBLE
/////////////////////////////////////////////////////

function pickup(){

 const p=active();
 if(!p) return;

 if(puckOwner===null){

  let dx=puck.position.x-p.position.x;
  let dz=puck.position.z-p.position.z;

  let d=Math.hypot(dx,dz);

  if(d<4){

   if(scrambleTimer<=0){
    scrambleTimer=10+Math.random()*10;
    scrambleOwner=controlled;
   }

   scrambleTimer--;

   if(scrambleTimer<=0){
    puckOwner=scrambleOwner;
    stickOffsetX=dx;
    stickOffsetZ=dz;
   }
  }

  return;
 }

 if(puckOwner!==controlled) return;

 stickOffsetX+=velX*0.3;
 stickOffsetZ+=velZ*0.3;

 stickOffsetX=Math.max(-2,Math.min(2,stickOffsetX));
 stickOffsetZ=Math.max(-2,Math.min(2,stickOffsetZ));

 puck.position.x+=(p.position.x+stickOffsetX-puck.position.x)*0.35;
 puck.position.z+=(p.position.z+stickOffsetZ-puck.position.z)*0.35;
 puck.position.y=1;
}

/////////////////////////////////////////////////////
// SHOOT
/////////////////////////////////////////////////////

addEventListener("mousedown",()=>{

 if(!hasPuck()) return;

 let dx=mouse.x;
 let dz=mouse.y;

 let len=Math.hypot(dx,dz);
 if(len<0.001){dx=0;dz=-1;len=1;}

 dx/=len;
 dz/=len;

 vx=dx*5;
 vz=dz*5;
 vy=Math.max(0,-mouse.y)*2;

 puckOwner=null;
});

/////////////////////////////////////////////////////
// PASS
/////////////////////////////////////////////////////

function pass(){

 if(!hasPuck()) return;

 const t=controlled==="user"?team:user;

 let dx=t.position.x-active().position.x;
 let dz=t.position.z-active().position.z;

 let len=Math.hypot(dx,dz);
 if(len<0.001) return;

 dx/=len;
 dz/=len;

 vx=dx*3.5;
 vz=dz*3.5;
 vy=0;

 passTimer=12;

 controlled=controlled==="user"?"team":"user";
}

addEventListener("keydown",e=>{
 if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// GOALIE SAFE AI
/////////////////////////////////////////////////////

function goalieAI(){

 if(!goalie) return;

 goalieAnimT+=0.08;

 let dx=puck.position.x-goalie.position.x;

 goalie.position.x+=(dx*0.1-goalie.position.x)*0.1;
 goalie.position.z=-38;

 goalie.rotation.z=Math.sin(goalieAnimT)*0.2;
}

/////////////////////////////////////////////////////
// SAVE SAFE
/////////////////////////////////////////////////////

function save(){

 if(!goalie) return;

 let dx=puck.position.x-goalie.position.x;
 let dz=puck.position.z-goalie.position.z;

 let d=Math.hypot(dx,dz);

 if(puck.position.z<-34 && d<3){

  vx*=-0.4;
  vz*=0.3;
  vy=1;
 }
}

/////////////////////////////////////////////////////
// AI SAFE
/////////////////////////////////////////////////////

function ai(){

 if(ai1) ai1.position.x+=(puck.position.x-ai1.position.x)*0.04;
 if(ai2) ai2.position.x+=(puck.position.x-ai2.position.x)*0.04;
}

/////////////////////////////////////////////////////
// WALL SAFE
/////////////////////////////////////////////////////

function wall(){

 if(!puck) return;

 if(puck.position.x<-98){puck.position.x=-98;vx*=-0.6;}
 if(puck.position.x>98){puck.position.x=98;vx*=-0.6;}
 if(puck.position.z<-58){puck.position.z=-58;vz*=-0.6;}
 if(puck.position.z>58){puck.position.z=58;vz*=-0.6;}
}

/////////////////////////////////////////////////////
// GOAL SAFE
/////////////////////////////////////////////////////

function goal(){

 if(!puck) return;

 if(puck.position.z<-40 &&
    puck.position.x>-7 &&
    puck.position.x<7){

  score++;
  document.getElementById("score").innerText=score+" - 0";

  puck.position.set(0,1,0);
  vx=vz=vy=0;
  puckOwner=null;
 }
}

/////////////////////////////////////////////////////
// PHYSICS SAFE
/////////////////////////////////////////////////////

function physics(){

 if(!puck) return;

 puck.position.x+=vx;
 puck.position.z+=vz;
 puck.position.y+=vy;

 vy-=0.08;

 if(puck.position.y<1){
  puck.position.y=1;
  vy=0;
 }

 vx*=0.96;
 vz*=0.96;

 wall();
 goalieAI();
 save();
 ai();
 goal();

 if(passTimer>0) passTimer--;
}

/////////////////////////////////////////////////////
// CAMERA SAFE
/////////////////////////////////////////////////////

function cam(){

 const p=active();
 if(!p) return;

 camera.position.x+=(p.position.x-camera.position.x)*0.08;
 camera.position.z+=(p.position.z+25-camera.position.z)*0.08;

 camera.lookAt(p.position.x,0,p.position.z-10);
}

/////////////////////////////////////////////////////
// LOOP (NO CRASH GUARANTEE)
/////////////////////////////////////////////////////

function loop(){

 requestAnimationFrame(loop);

 try{
  move();
  pickup();
  physics();
  cam();
 }catch(e){
  console.log("runtime:",e);
 }

 renderer.render(scene,camera);
}

init();
loop();

</script>

</body>
</html>
