<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hockey Engine V4 Real Height</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:20px;
}
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.9));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL (REAL SIZE + HEIGHT)
/////////////////////////////////////////////////////

function makeGoal(){

  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:0xff0000});

  const left = new THREE.Mesh(new THREE.BoxGeometry(0.4,8,0.4),mat);
  const right = new THREE.Mesh(new THREE.BoxGeometry(0.4,8,0.4),mat);
  const top = new THREE.Mesh(new THREE.BoxGeometry(12,0.4,0.4),mat);

  left.position.set(-6,4,-40);
  right.position.set(6,4,-40);
  top.position.set(0,8,-40);

  g.add(left,right,top);
  scene.add(g);
}
makeGoal();

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PLAYERS
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const teammate = player(0x3399ff,25);
const ai = player(0xff3333,-35);
const defender = player(0xff7777,-20);

/////////////////////////////////////////////////////
// 🧊 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🧠 STATE
/////////////////////////////////////////////////////

let owner = "free";
let vx = 0;
let vz = 0;
let vy = 0;

let score = 0;

let controlled = "user";
let lock = false;

let mouse = {x:0,y:0};

let shotAccuracy = 0.94;

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys = {};

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
  mouse.x = (e.clientX/innerWidth - 0.5)*2;
  mouse.y = (e.clientY/innerHeight - 0.5)*2;
});

/////////////////////////////////////////////////////
// 🧍 ACTIVE PLAYER
/////////////////////////////////////////////////////

function active(){
  return controlled === "user" ? user : teammate;
}

/////////////////////////////////////////////////////
// 🏒 PICKUP
/////////////////////////////////////////////////////

function pickup(){

  if(owner !== "free") return;
  if(lock) return;

  const p = active();

  const dx = puck.position.x - p.position.x;
  const dz = puck.position.z - p.position.z;

  const d = Math.sqrt(dx*dx + dz*dz);

  if(d < 3.5){
    owner = controlled;
    vx = 0; vz = 0; vy = 0;
  }
}

/////////////////////////////////////////////////////
// 🎯 SHOOT (HEIGHT + 94% ACCURACY)
/////////////////////////////////////////////////////

function shoot(){

  if(owner !== controlled) return;
  if(lock) return;

  lock = true;

  let dx = mouse.x;
  let dz = mouse.y;

  // 🎯 accuracy noise (small)
  let noise = (1 - shotAccuracy);
  dx += (Math.random()-0.5)*noise*0.6;
  dz += (Math.random()-0.5)*noise*0.6;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ lock=false; return; }

  let power = 3.2;

  // 🏒 HEIGHT SYSTEM (IMPORTANT)
  // higher mouseY = higher shot
  vy = -mouse.y * 2.2;

  vx = (dx/len)*power;
  vz = (dz/len)*power;

  owner = "free";

  setTimeout(()=>lock=false,80);
}

addEventListener("mousedown",shoot);

/////////////////////////////////////////////////////
// 🤝 PASS
/////////////////////////////////////////////////////

function pass(){

  if(owner !== controlled) return;
  if(lock) return;

  lock = true;

  const t = controlled === "user" ? teammate : user;

  const dx = t.position.x - active().position.x;
  const dz = t.position.z - active().position.z;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ lock=false; return; }

  vx = (dx/len)*2.6;
  vz = (dz/len)*2.6;
  vy = 0;

  owner = "free";

  controlled = controlled === "user" ? "teammate" : "user";

  setTimeout(()=>lock=false,80);
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🧊 PHYSICS (WITH HEIGHT)
/////////////////////////////////////////////////////

function physics(){

  if(owner !== "free"){
    const p = active();
    puck.position.x = p.position.x;
    puck.position.z = p.position.z - 2;
    puck.position.y = 1;
    return;
  }

  puck.position.x += vx;
  puck.position.z += vz;

  // 🏒 vertical motion (realistic arc)
  puck.position.y += vy;
  vy -= 0.12; // gravity

  if(puck.position.y < 1){
    puck.position.y = 1;
    vy = 0;
  }

  vx *= 0.96;
  vz *= 0.96;
}

/////////////////////////////////////////////////////
// 🛡 BLOCK + SAVE SYSTEM
/////////////////////////////////////////////////////

function defense(){

  // 🥅 goalie save
  let dxg = puck.position.x - goalie.position.x;
  let dzg = puck.position.z - goalie.position.z;
  let dg = Math.sqrt(dxg*dxg + dzg*dzg);

  if(dg < 2.2 && puck.position.z < -30){
    vx *= -0.4;
    vz *= -0.4;
    vy *= 0.2;
    puck.position.z += 2;

    document.getElementById("msg").innerText = "SAVE!";
    setTimeout(()=>document.getElementById("msg").innerText="",500);
    return;
  }

  // 🛡 defenders block
  for(let d of [ai, defender]){

    let dx = puck.position.x - d.position.x;
    let dz = puck.position.z - d.position.z;
    let dist = Math.sqrt(dx*dx + dz*dz);

    if(dist < 2){

      vx *= -0.3;
      vz *= -0.3;
      vy *= 0.2;

      document.getElementById("msg").innerText = "BLOCK!";
      setTimeout(()=>document.getElementById("msg").innerText="",400);
      return;
    }
  }
}

/////////////////////////////////////////////////////
// 🤖 AI
/////////////////////////////////////////////////////

function aiLogic(){

  ai.position.x += (puck.position.x - ai.position.x)*0.05;
  defender.position.x += (puck.position.x - defender.position.x)*0.05;
}

/////////////////////////////////////////////////////
// 🥅 GOALIE MOVE
/////////////////////////////////////////////////////

function goalieAI(){
  goalie.position.x += (puck.position.x - goalie.position.x)*0.08;
  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK
/////////////////////////////////////////////////////

function goal(){

  return (
    puck.position.z < -40 &&
    puck.position.x > -6 &&
    puck.position.x < 6
  );
}

/////////////////////////////////////////////////////
// 🔁 RESET
/////////////////////////////////////////////////////

function reset(){

  puck.position.set(0,1,0);
  vx = 0; vz = 0; vy = 0;
  owner = "free";
  controlled = "user";

  user.position.set(0,2,35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  const p = active();

  if(keys["KeyA"]) p.position.x -= 0.9;
  if(keys["KeyD"]) p.position.x += 0.9;
  if(keys["KeyW"]) p.position.z -= 0.9;
  if(keys["KeyS"]) p.position.z += 0.9;

  pickup();
  physics();
  defense();
  aiLogic();
  goalieAI();

  if(goal()){

    score++;

    document.getElementById("hud").innerText =
      "0 - " + score;

    document.getElementById("msg").innerText = "GOAL!";
    setTimeout(()=>document.getElementById("msg").innerText="",800);

    reset();
  }

  camera.position.x += (p.position.x - camera.position.x)*0.04;
  camera.lookAt(p.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
