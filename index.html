<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Hockey Engine v2</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}
</style>
</head>
<body>

<div id="hud">SINÄ 0 - 0 AI</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 SCENE
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.7));

const light = new THREE.DirectionalLight(0xffffff,1.4);
light.position.set(10,30,10);
scene.add(light);

/////////////////////////////////////////////////////
// 🎥 CAMERA
/////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff, roughness:0.05})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🧱 BOARDS (TÄRKEÄ UUTUUS)
/////////////////////////////////////////////////////

const boardMat = new THREE.MeshStandardMaterial({color:0xffffff});

function board(x,z,w,h){
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,2,h),boardMat);
  b.position.set(x,1,z);
  scene.add(b);
  return b;
}

// kentän reunat
board(0,60,180,2);
board(0,-60,180,2);
board(90,0,2,120);
board(-90,0,2,120);

/////////////////////////////////////////////////////
// 🏒 PLAYER
/////////////////////////////////////////////////////

function player(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const user = player(0x0066ff,35);
const ai = player(0xff3333,-35);

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

/////////////////////////////////////////////////////
// 🏒 PUCK
/////////////////////////////////////////////////////

const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
scene.add(puck);

/////////////////////////////////////////////////////
// 🎮 INPUT
/////////////////////////////////////////////////////

let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse={x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

/////////////////////////////////////////////////////
// 🧠 STATE
/////////////////////////////////////////////////////

let vx=0,vz=0;
let hasPuck=false;
let score=0;

/////////////////////////////////////////////////////
// 🏒 SHOOT (physics impulse)
/////////////////////////////////////////////////////

addEventListener("mousedown",()=>{

  if(!hasPuck) return;

  const dirX = mouse.x;
  const dirZ = mouse.y;

  const len = Math.sqrt(dirX*dirX+dirZ*dirZ);

  vx = (dirX/len) * 1.5;
  vz = (dirZ/len) * 1.5;

  hasPuck=false;
});

/////////////////////////////////////////////////////
// 🤖 AI FORMATION (2-1-2 basic)
/////////////////////////////////////////////////////

function aiFormation(){

  // center
  ai.position.x += (puck.position.x - ai.position.x)*0.05;

  // puolustusvyöhyke
  if(puck.position.z < 10){
    ai.position.z += 0.04;
  } else {
    ai.position.z -= 0.02;
  }

  ai.position.x = Math.max(-80,Math.min(80,ai.position.x));
}

/////////////////////////////////////////////////////
// 🥅 GOALIE AI (angle block)
/////////////////////////////////////////////////////

function goalieAI(){

  const target = puck.position.x;

  goalie.position.x += (target - goalie.position.x)*0.12;
  goalie.position.x = Math.max(-6,Math.min(6,goalie.position.x));
  goalie.position.z = -38;
}

/////////////////////////////////////////////////////
// 🧱 BOARD COLLISIONS (TÄRKEÄ FIX)
/////////////////////////////////////////////////////

function boardCollision(){

  if(puck.position.x > 88 || puck.position.x < -88){
    vx *= -0.7;
  }

  if(puck.position.z > 58 || puck.position.z < -58){
    vz *= -0.7;
  }
}

/////////////////////////////////////////////////////
// 🧊 RESET
/////////////////////////////////////////////////////

function reset(){
  puck.position.set(0,1,0);
  vx=0;vz=0;
  hasPuck=false;

  user.position.set(0,2,35);
  ai.position.set(0,2,-35);
  goalie.position.set(0,2,-38);
}

/////////////////////////////////////////////////////
// 🎮 LOOP
/////////////////////////////////////////////////////

function loop(){

  requestAnimationFrame(loop);

  /////////////////////////////////////////////////////
  // PLAYER SKATE (momentum feel)
  /////////////////////////////////////////////////////

  let speed=0.9;

  if(keys["KeyA"]) user.position.x -= speed;
  if(keys["KeyD"]) user.position.x += speed;
  if(keys["KeyW"]) user.position.z -= speed;
  if(keys["KeyS"]) user.position.z += speed;

  /////////////////////////////////////////////////////
  // PUCK PICKUP
  /////////////////////////////////////////////////////

  let dx=puck.position.x-user.position.x;
  let dz=puck.position.z-user.position.z;
  let dist=Math.sqrt(dx*dx+dz*dz);

  if(dist<3.5) hasPuck=true;

  /////////////////////////////////////////////////////
  // PUCK PHYSICS (ice friction)
  /////////////////////////////////////////////////////

  if(hasPuck){
    puck.position.x=user.position.x;
    puck.position.z=user.position.z-2;
  } else {
    puck.position.x+=vx;
    puck.position.z+=vz;

    vx*=0.96;
    vz*=0.96;
  }

  /////////////////////////////////////////////////////
  // SYSTEMS
  /////////////////////////////////////////////////////

  aiFormation();
  goalieAI();
  boardCollision();

  /////////////////////////////////////////////////////
  // SAVE
  /////////////////////////////////////////////////////

  if(puck.position.z<-37 &&
     Math.abs(puck.position.x-goalie.position.x)<3){
    vx*=-0.5;
  }

  /////////////////////////////////////////////////////
  // GOAL
  /////////////////////////////////////////////////////

  if(puck.position.z<-40){
    score++;
    document.getElementById("hud").innerText=
      "SINÄ "+score+" - AI 0";
    reset();
  }

  /////////////////////////////////////////////////////
  // CAMERA (broadcast style)
  /////////////////////////////////////////////////////

  camera.position.x+=(user.position.x-camera.position.x)*0.04;
  camera.lookAt(user.position.x,0,0);

  renderer.render(scene,camera);
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
