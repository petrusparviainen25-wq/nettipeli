<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Safe Hockey Engine</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
}

#msg {
  position:absolute;
  top:50px;
  left:10px;
  color:yellow;
  font-size:20px;
}
</style>
</head>
<body>

<div id="hud">0 - 0</div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🌍 WORLD (SAFE)
/////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaad8ff);

scene.add(new THREE.AmbientLight(0xffffff,0.9));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,55);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

/////////////////////////////////////////////////////
// 🥅 GOAL
/////////////////////////////////////////////////////

const goalGroup = new THREE.Group();
const goalMat = new THREE.MeshStandardMaterial({color:0xff0000});

const gL = new THREE.Mesh(new THREE.BoxGeometry(0.4,4,0.4),goalMat);
const gR = new THREE.Mesh(new THREE.BoxGeometry(0.4,4,0.4),goalMat);
const gT = new THREE.Mesh(new THREE.BoxGeometry(8,0.4,0.4),goalMat);

gL.position.set(-4,2,-40);
gR.position.set(4,2,-40);
gT.position.set(0,4,-40);

goalGroup.add(gL,gR,gT);
scene.add(goalGroup);

/////////////////////////////////////////////////////
// 🥅 GOALIE
/////////////////////////////////////////////////////

const goalieMesh = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.6,2.6,6,10),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalieMesh.position.set(0,2,-38);
scene.add(goalieMesh);

/////////////////////////////////////////////////////
// 🏒 PLAYERS (RENAMED SAFE)
/////////////////////////////////////////////////////

function makePlayer(color,z){
  const p = new THREE.Mesh(
    new THREE.CapsuleGeometry(1.2,2,6,10),
    new THREE.MeshStandardMaterial({color})
  );
  p.position.set(0,2,z);
  scene.add(p);
  return p;
}

const playerUser = makePlayer(0x0066ff,35);
const playerMate = makePlayer(0x3399ff,25);
const playerAI = makePlayer(0xff3333,-35);
const playerDef = makePlayer(0xff7777,-20);

/////////////////////////////////////////////////////
// 🧊 PUCK
/////////////////////////////////////////////////////

const puckMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puckMesh.rotation.x = Math.PI/2;
scene.add(puckMesh);

/////////////////////////////////////////////////////
// 🧠 SAFE STATE
/////////////////////////////////////////////////////

let puckOwner = "free";
let velX = 0;
let velZ = 0;
let score = 0;

let controlledPlayer = "user";
let lockAction = false;

let mouseX = 0;
let mouseY = 0;
let highShot = false;

/////////////////////////////////////////////////////
// 🎮 INPUT SAFE
/////////////////////////////////////////////////////

let keys = {};

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
  mouseX = (e.clientX/innerWidth - 0.5)*2;
  mouseY = (e.clientY/innerHeight - 0.5)*2;

  highShot = mouseY < -0.25;
});

/////////////////////////////////////////////////////
// 🧍 ACTIVE PLAYER
/////////////////////////////////////////////////////

function active(){
  return controlledPlayer === "user" ? playerUser : playerMate;
}

/////////////////////////////////////////////////////
// 🏒 PICKUP SAFE
/////////////////////////////////////////////////////

function pickup(){

  if(puckOwner !== "free") return;
  if(lockAction) return;

  const p = active();

  const dx = puckMesh.position.x - p.position.x;
  const dz = puckMesh.position.z - p.position.z;

  const dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 3.5){
    puckOwner = controlledPlayer;
    velX = 0;
    velZ = 0;
  }
}

/////////////////////////////////////////////////////
// 🏒 SHOOT SAFE
/////////////////////////////////////////////////////

function shoot(){

  if(puckOwner !== controlledPlayer) return;
  if(lockAction) return;

  lockAction = true;

  let dx = mouseX;
  let dz = mouseY;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ lockAction=false; return; }

  let power = 3.2;

  if(highShot){
    power = 2.6;
    puckMesh.position.y = 2.5;
  } else {
    puckMesh.position.y = 1;
  }

  velX = (dx/len)*power;
  velZ = (dz/len)*power;

  puckOwner = "free";

  setTimeout(()=>lockAction=false,80);
}

addEventListener("mousedown",shoot);

/////////////////////////////////////////////////////
// 🤝 PASS + SWITCH SAFE
/////////////////////////////////////////////////////

function pass(){

  if(puckOwner !== controlledPlayer) return;
  if(lockAction) return;

  lockAction = true;

  const target = controlledPlayer === "user" ? playerMate : playerUser;

  const dx = target.position.x - active().position.x;
  const dz = target.position.z - active().position.z;

  let len = Math.sqrt(dx*dx + dz*dz);
  if(len === 0){ lockAction=false; return; }

  velX = (dx/len)*2.6;
  velZ = (dz/len)*2.6;

  puckOwner = "free";

  controlledPlayer = controlledPlayer === "user" ? "mate" : "user";

  setTimeout(()=>lockAction=false,80);
}

addEventListener("keydown",e=>{
  if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// 🧊 PUCK PHYSICS SAFE
/////////////////////////////////////////////////////

function physics(){

  if(puckOwner !== "free"){
    const p = active();
    puckMesh.position.x = p.position.x;
    puckMesh.position.z = p.position.z - 2;
    return;
  }

  puckMesh.position.x += velX;
  puckMesh.position.z += velZ;

  velX *= 0.96;
  velZ *= 0.96;

  if(Math.abs(velX)<0.01) velX=0;
  if(Math.abs(velZ)<0.01) velZ=0;
}

/////////////////////////////////////////////////////
// 🤖 AI SAFE (NO NAME CONFLICT)
/////////////////////////////////////////////////////

function aiLogic(){

  playerAI.position.x += (puckMesh.position.x - playerAI.position.x)*0.05;
  playerDef.position.x += (puckMesh.position.x - playerDef.position.x)*0.05;
}

/////////////////////////////////////////////////////
// 🥅 GOALIE SAFE
/////////////////////////////////////////////////////

function goalie(){

  goalieMesh.position.x += (puckMesh.position.x - goalieMesh.position.x)*0.08;
  goalieMesh.position.x = Math.max(-6,Math.min(6,goalieMesh.position.x));
}

/////////////////////////////////////////////////////
// 🥅 GOAL CHECK
/////////////////////////////////////////////////////

function goalCheck(){

  return (
    puckMesh.position.z < -40 &&
    puckMesh.position.x > -4 &&
    puckMesh.position.x < 4
  );
}

/////////////////////////////////////////////////////
// 🔁 RESET SAFE
/////////////////////////////////////////////////////

function reset(){

  puckMesh.position.set(0,1,0);
  velX = 0;
  velZ = 0;
  puckOwner = "free";
  controlledPlayer = "user";

  playerUser.position.set(0,2,35);
}

/////////////////////////////////////////////////////
// 🎮 LOOP SAFE (NO CRASH POSSIBLE)
/////////////////////////////////////////////////////

function loop(){

  try{

    requestAnimationFrame(loop);

    const p = active();

    if(keys["KeyA"]) p.position.x -= 0.9;
    if(keys["KeyD"]) p.position.x += 0.9;
    if(keys["KeyW"]) p.position.z -= 0.9;
    if(keys["KeyS"]) p.position.z += 0.9;

    pickup();
    physics();
    aiLogic();
    goalie();

    if(goalCheck()){

      score++;

      document.getElementById("hud").innerText =
        "0 - " + score;

      document.getElementById("msg").innerText = "GOAL!";

      setTimeout(()=>document.getElementById("msg").innerText="",800);

      reset();
    }

    camera.position.x += (p.position.x - camera.position.x)*0.04;
    camera.lookAt(p.position.x,0,0);

    renderer.render(scene,camera);

  } catch(err){
    console.error("SAFE ENGINE ERROR:",err);
  }
}

loop();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
