<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL GAMEPLAY LOOP</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
}
</style>
</head>
<body>

<div id="hud">YOU 0 - 0 AI</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaadfff);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,25,45);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.DirectionalLight(0xffffff,1.2).position.set(10,30,10));
scene.add(new THREE.AmbientLight(0x666666));

// ================= ICE =================
const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(120,80),
  new THREE.MeshStandardMaterial({color:0xe8f6ff, roughness:0.05})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// ================= PLAYER =================
const player = new THREE.Group();
const pBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0x0055ff})
);
player.add(pBody);
player.position.set(0,2,30);
scene.add(player);

// ================= AI PLAYER =================
const ai = new THREE.Group();
const aiBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0xff3333})
);
ai.add(aiBody);
ai.position.set(0,2,-30);
scene.add(ai);

// ================= PUCK =================
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
puck.position.set(0,1,0);
scene.add(puck);

// ================= GOAL =================
const goal = new THREE.Mesh(
  new THREE.BoxGeometry(12,6,1),
  new THREE.MeshStandardMaterial({color:0xff0000, wireframe:true})
);
goal.position.set(0,3,-35);
scene.add(goal);

// ================= INPUT =================
let keys = {};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// mouse aim
let mouse = {x:0,y:0};
let aim = new THREE.Vector3();
let aimSmooth = new THREE.Vector3();

window.addEventListener("mousemove",(e)=>{
  mouse.x = (e.clientX/window.innerWidth - 0.5)*2;
  mouse.y = (e.clientY/window.innerHeight - 0.5)*2;
});

// ================= GAME STATE =================
let vx=0, vz=0;
let hasPuck=false;

let playerScore=0;
let aiScore=0;

// ================= SHOOT =================
window.addEventListener("mousedown",()=>{

  if(hasPuck){
    vx = (aimSmooth.x - player.position.x) * 0.3;
    vz = (aimSmooth.z - player.position.z) * 0.3;
    hasPuck = false;
  }
});

// ================= AI LOGIC =================
function aiMove(){

  // AI seuraa kiekkoa
  ai.position.x += (puck.position.x - ai.position.x) * 0.05;

  // AI “paineistaa” jos kiekko on sen alueella
  if(puck.position.z < -10){
    ai.position.z += 0.03;
  } else {
    ai.position.z -= 0.02;
  }

  ai.position.z = Math.max(-35, Math.min(-5, ai.position.z));
}

// ================= LOOP =================
function animate(){

  requestAnimationFrame(animate);

  // ================= PLAYER MOVE =================
  if(keys["KeyA"]) player.position.x -= 0.7;
  if(keys["KeyD"]) player.position.x += 0.7;
  if(keys["KeyW"]) player.position.z -= 0.7;
  if(keys["KeyS"]) player.position.z += 0.7;

  player.position.x = Math.max(-55,Math.min(55,player.position.x));
  player.position.z = Math.max(-10,Math.min(55,player.position.z));

  // ================= AIM =================
  aim.x = player.position.x + mouse.x * 18;
  aim.z = player.position.z + mouse.y * 18 - 15;
  aimSmooth.lerp(aim,0.2);

  // ================= PUCK CONTROL =================
  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 4 && !hasPuck){
    hasPuck = true;
  }

  if(hasPuck){
    puck.position.x = player.position.x;
    puck.position.z = player.position.z - 2;
    puck.position.y = 1;
    vx = 0; vz = 0;
  }

  // ================= PUCK MOVE =================
  puck.position.x += vx;
  puck.position.z += vz;

  vx *= 0.97;
  vz *= 0.97;

  // ================= AI =================
  aiMove();

  // AI steal (yksinkertainen)
  let dx2 = puck.position.x - ai.position.x;
  let dz2 = puck.position.z - ai.position.z;
  let dist2 = Math.sqrt(dx2*dx2 + dz2*dz2);

  if(dist2 < 4 && !hasPuck){
    vx = (player.position.x - ai.position.x) * 0.25;
    vz = (player.position.z - ai.position.z) * 0.25;
  }

  // ================= GOAL =================
  if(puck.position.z < -35){
    playerScore++;
    reset();
  }

  if(puck.position.z > 35){
    aiScore++;
    reset();
  }

  document.getElementById("hud").innerText =
    `YOU ${playerScore} - ${aiScore} AI`;

  renderer.render(scene,camera);
}

// ================= RESET =================
function reset(){
  puck.position.set(0,1,0);
  vx=0; vz=0;
  hasPuck=false;

  player.position.set(0,2,30);
  ai.position.set(0,2,-30);
}

animate();

// resize
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
