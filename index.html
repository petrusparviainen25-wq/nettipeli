<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>3D NHL Mini</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaadfff);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 45, 60);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ================= ICE =================
const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 80),
  new THREE.MeshBasicMaterial({color:0xe6f7ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// center line
function line(x1,z1,x2,z2,color=0xff0000){
  const mat = new THREE.LineBasicMaterial({color});
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x1,0.1,z1),
    new THREE.Vector3(x2,0.1,z2)
  ]);
  scene.add(new THREE.Line(geo,mat));
}

line(-60,0,60,0,0xff0000);
line(-60,-20,60,-20,0x0000ff);

// ================= PLAYER =================
const player = new THREE.Mesh(
  new THREE.BoxGeometry(2,2,2),
  new THREE.MeshBasicMaterial({color:0x0000ff})
);
player.position.set(0,1,30);
scene.add(player);

// ================= PUCK =================
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshBasicMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
puck.position.set(0,1,10);
scene.add(puck);

// ================= GOAL =================
const goal = new THREE.Mesh(
  new THREE.BoxGeometry(12,6,1),
  new THREE.MeshBasicMaterial({color:0xff0000, wireframe:true})
);
goal.position.set(0,3,-35);
scene.add(goal);

// ================= GOALIE =================
const goalie = new THREE.Mesh(
  new THREE.BoxGeometry(4,4,2),
  new THREE.MeshBasicMaterial({color:0x800080})
);
goalie.position.set(0,2,-32);
scene.add(goalie);

// ================= INPUT =================
let keys = {};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// mouse aim
let mouse = {x:0,y:0};
let aim = new THREE.Vector3();

window.addEventListener("mousemove",(e)=>{
  mouse.x = (e.clientX/window.innerWidth - 0.5)*2;
  mouse.y = (e.clientY/window.innerHeight - 0.5)*2;
});

window.addEventListener("mousedown",()=>{
  shoot();
});

// ================= PHYSICS =================
let vx = 0, vz = 0;
let score = 0;

// ================= SHOOT =================
function shoot(){
  vx = (aim.x - puck.position.x) * 0.25;
  vz = (aim.z - puck.position.z) * 0.25;
}

// ================= LOOP =================
function animate(){

  requestAnimationFrame(animate);

  // ===== PLAYER MOVE =====
  if(keys["KeyA"]) player.position.x -= 0.7;
  if(keys["KeyD"]) player.position.x += 0.7;
  if(keys["KeyW"]) player.position.z -= 0.7;
  if(keys["KeyS"]) player.position.z += 0.7;

  // bounds
  player.position.x = Math.max(-55, Math.min(55, player.position.x));
  player.position.z = Math.max(-35, Math.min(35, player.position.z));

  // ===== AIM SYSTEM =====
  aim.x = player.position.x + mouse.x * 15;
  aim.z = player.position.z - 20 + mouse.y * 15;

  // ===== PUCK =====
  puck.position.x += vx;
  puck.position.z += vz;

  vx *= 0.98;
  vz *= 0.98;

  // player control puck
  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 4){
    vx += dx * 0.03;
    vz += dz * 0.03;
  }

  // ===== GOALIE AI =====
  goalie.position.x += (puck.position.x - goalie.position.x) * 0.05;

  // block
  if(puck.position.z < -30 &&
     Math.abs(puck.position.x - goalie.position.x) < 3){
    vz *= -0.6;
  }

  // ===== GOAL =====
  if(puck.position.z < -35){
    score++;
    puck.position.set(0,1,10);
    vx = 0; vz = 0;
    console.log("GOAL! score:",score);
  }

  // ===== VISUAL AIM LINE =====
  const mat = new THREE.LineBasicMaterial({color:0xff0000});
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(player.position.x,1,player.position.z),
    new THREE.Vector3(aim.x,1,aim.z)
  ]);
  const line = new THREE.Line(geo,mat);
  scene.add(line);
  setTimeout(()=>scene.remove(line),16);

  renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
