<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Realistisempi Jääkiekko</title>
<style>
  body {
    margin: 0;
    background: #0b1d2a;
    color: white;
    text-align: center;
    font-family: Arial;
  }

  canvas {
    background: #e6f7ff;
    display: block;
    margin: auto;
    border: 3px solid white;
  }
</style>
</head>
<body>

<h2>🏒 Jääkiekko (Realistisempi)</h2>
<p>← → liiku | SPACE = lyönti</p>
<p>Pisteet: <span id="score">0</span></p>

<canvas id="game" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x: 280,
  y: 330,
  width: 40,
  height: 20,
  speed: 5
};

let puck = {
  x: 300,
  y: 200,
  radius: 10,
  vx: 2,
  vy: 2
};

let goal = {
  x: 250,
  y: 0,
  width: 100,
  height: 10
};

let goalie = {
  x: 260,
  y: 20,
  width: 80,
  height: 15,
  speed: 2.5
};

let score = 0;
let keys = {};

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

function update() {

  // 🧍 pelaaja liike
  if (keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["ArrowRight"]) player.x += player.speed;
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

  // 🏒 kiekon liike
  puck.x += puck.vx;
  puck.y += puck.vy;

  // ⚡ kitka (hidastaa)
  puck.vx *= 0.99;
  puck.vy *= 0.99;

  // seinät (kulmat säilyy)
  if (puck.x < puck.radius || puck.x > canvas.width - puck.radius) {
    puck.vx *= -1;
  }

  if (puck.y < puck.radius || puck.y > canvas.height - puck.radius) {
    puck.vy *= -1;
  }

  // 🏒 maila osuma (kulma riippuu osumasta)
  if (
    puck.y + puck.radius > player.y &&
    puck.x > player.x &&
    puck.x < player.x + player.width
  ) {
    let hitPos = (puck.x - (player.x + player.width / 2)) / 20;

    puck.vx = hitPos * 2; // kulma
    puck.vy = -5;
  }

  // 💥 SPACE lyönti (lisävoima)
  if (keys["Space"]) {
    let dx = puck.x - (player.x + player.width / 2);
    let dy = puck.y - player.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < 60) {
      puck.vx = dx / 5;
      puck.vy = -7;
    }
  }

  // 🧠 maalivahti (ei täydellinen)
  let target = puck.x - goalie.width / 2;

  // pieni viive/liike-epätarkkuus
  goalie.x += (target - goalie.x) * 0.05;

  goalie.x = Math.max(0, Math.min(canvas.width - goalie.width, goalie.x));

  // 🧤 torjunta (kulma muuttuu)
  if (
    puck.y - puck.radius < goalie.y + goalie.height &&
    puck.x > goalie.x &&
    puck.x < goalie.x + goalie.width
  ) {
    let bounce = (puck.x - (goalie.x + goalie.width / 2)) / 20;
    puck.vx = bounce * 3;
    puck.vy = Math.abs(puck.vy);
  }

  // 🥅 maali
  if (
    puck.y - puck.radius <= goal.y + goal.height &&
    puck.x > goal.x &&
    puck.x < goal.x + goal.width
  ) {
    score++;
    document.getElementById("score").textContent = score;

    puck.x = 300;
    puck.y = 200;
    puck.vx = 2;
    puck.vy = 2;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // jää
  ctx.fillStyle = "#e6f7ff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // maali
  ctx.fillStyle = "red";
  ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

  // maalivahti
  ctx.fillStyle = "purple";
  ctx.fillRect(goalie.x, goalie.y, goalie.width, goalie.height);

  // pelaaja
  ctx.fillStyle = "blue";
  ctx.fillRect(player.x, player.y, player.width, player.height);

  // kiekko
  ctx.beginPath();
  ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
  ctx.fillStyle = "black";
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
