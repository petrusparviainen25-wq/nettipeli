<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL 24 STYLE FINAL</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ================= SCENE =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaadfff);

// CAMERA (broadcast NHL angle)
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,25,45);
camera.lookAt(0,0,0);

// RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHTS
scene.add(new THREE.DirectionalLight(0xffffff, 1.3).position.set(10,30,10));
scene.add(new THREE.AmbientLight(0x777777));

// ================= ICE (FIXED REALISTIC) =================
const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(120,80),
  new THREE.MeshStandardMaterial({
    color: 0xe8f6ff,
    roughness: 0.05,
    metalness: 0.15
  })
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// center line
const lineGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(-60,0.1,0),
  new THREE.Vector3(60,0.1,0)
]);
scene.add(new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0xff0000})));

// ================= PLAYER =================
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0x0055ff})
);

const stick = new THREE.Mesh(
  new THREE.BoxGeometry(0.2,0.2,4),
  new THREE.MeshStandardMaterial({color:0x333333})
);
stick.position.z = -2;

player.add(body);
player.add(stick);
player.position.set(0,2,30);
scene.add(player);

// ================= PUCK =================
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
puck.position.set(0,1,10);
scene.add(puck);

// ================= GOAL =================
const goal = new THREE.Mesh(
  new THREE.BoxGeometry(12,6,1),
  new THREE.MeshStandardMaterial({color:0xff0000, wireframe:true})
);
goal.position.set(0,3,-35);
scene.add(goal);

// ================= GOALIE =================
const goalie = new THREE.Group();

const gBody = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.5,2.5,4,8),
  new THREE.MeshStandardMaterial({color:0xffffff})
);

const pads = new THREE.Mesh(
  new THREE.BoxGeometry(2,1,1),
  new THREE.MeshStandardMaterial({color:0xff0000})
);
pads.position.y = -1.5;

goalie.add(gBody);
goalie.add(pads);
goalie.position.set(0,2,-32);
scene.add(goalie);

// ================= INPUT =================
let keys = {};
document.addEventListener("keydown",e=>keys[e.code]=true);
document.addEventListener("keyup",e=>keys[e.code]=false);

// mouse
let mouse = {x:0,y:0};
let aim = new THREE.Vector3();
let aimSmooth = new THREE.Vector3();

window.addEventListener("mousemove",(e)=>{
  mouse.x = (e.clientX/window.innerWidth - 0.5)*2;
  mouse.y = (e.clientY/window.innerHeight - 0.5)*2;
});

// ================= PHYSICS =================
let vx=0, vz=0;
let hasPuck=false;
let lift = 1;

// ================= SHOOT =================
window.addEventListener("mousedown",()=>{

  if(hasPuck){

    vx = (aimSmooth.x - player.position.x) * 0.28;
    vz = (aimSmooth.z - player.position.z) * 0.28;

    // 🏒 REAL NHL LIFT (ei kaari, vaan laukaisun korkeus)
    lift = 1 + (-mouse.y * 2.5);

    hasPuck = false;
  }
});

// ================= LOOP =================
function animate(){

  requestAnimationFrame(animate);

  // 🧍‍♂️ skating (smooth movement)
  let mx = 0, mz = 0;

  if(keys["KeyA"]) mx -= 1;
  if(keys["KeyD"]) mx += 1;
  if(keys["KeyW"]) mz -= 1;
  if(keys["KeyS"]) mz += 1;

  player.position.x += mx * 0.6;
  player.position.z += mz * 0.6;

  player.position.x = Math.max(-55,Math.min(55,player.position.x));
  player.position.z = Math.max(-35,Math.min(35,player.position.z));

  // 🎯 SMOOTH AIM
  aim.x = player.position.x + mouse.x * 18;
  aim.z = player.position.z + mouse.y * 18 - 15;
  aimSmooth.lerp(aim, 0.2);

  // 🏒 PUCK MOVE
  puck.position.x += vx;
  puck.position.z += vz;

  vx *= 0.97;
  vz *= 0.97;

  // 🧊 HEIGHT CONTROL (NO ARC PHYSICS)
  puck.position.y += (lift - puck.position.y) * 0.25;

  // 🧊 ICE COLLISION
  if(puck.position.y < 1){
    puck.position.y = 1;
  }

  // 🧠 STICK CONTROL
  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 4 && !hasPuck){
    hasPuck = true;
  }

  if(hasPuck){
    puck.position.x = player.position.x;
    puck.position.z = player.position.z - 2;
    puck.position.y = 1;
    vx = 0; vz = 0;
  }

  // 🥅 GOALIE AI
  goalie.position.x += (puck.position.x - goalie.position.x) * 0.06;

  // 🧤 SAVE LOGIC
  if(puck.position.z < -30 &&
     Math.abs(puck.position.x - goalie.position.x) < 3 &&
     puck.position.y < 3){
    vz *= -0.5;
  }

  // 🥅 GOAL RESET
  if(puck.position.z < -35){
    puck.position.set(0,1,10);
    vx=0; vz=0;
    hasPuck=false;
    lift=1;
  }

  renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
