<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL V15 SAFE GOAL NET</title>
<style>
body { margin:0; overflow:hidden; background:#87cfff; }
canvas { display:block; }
#score{
 position:absolute;
 top:10px;
 left:10px;
 color:white;
 font-family:Arial;
 font-size:22px;
}
</style>
</head>
<body>

<div id="score">0 - 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/////////////////////////////////////////////////////
// 🧠 SAFE CORE
/////////////////////////////////////////////////////

let scene, camera, renderer;

let puck, user, team, ai1, ai2, goalie;

let vx=0, vz=0, vy=0;
let velX=0, velZ=0;

let keys={};
let mouse={x:0,y:0};

let controlled="user";
let score=0;

/////////////////////////////////////////////////////
// INIT SAFE
/////////////////////////////////////////////////////

function init(){

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87cfff);

camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,25,60);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// lights
scene.add(new THREE.AmbientLight(0xffffff,1.2));

const light = new THREE.DirectionalLight(0xffffff,1.3);
light.position.set(10,30,10);
scene.add(light);

// world
ice();
boards();
goalNet();   // 🔥 FIXED GOAL
players();
puckObj();

}

/////////////////////////////////////////////////////
// 🧊 ICE
/////////////////////////////////////////////////////

function ice(){
 let g = new THREE.Mesh(
  new THREE.PlaneGeometry(200,120),
  new THREE.MeshStandardMaterial({color:0xdff6ff})
 );
 g.rotation.x = -Math.PI/2;
 scene.add(g);
}

/////////////////////////////////////////////////////
// 🧱 BOARDS (SAFE)
/////////////////////////////////////////////////////

function boards(){

 const m = new THREE.MeshStandardMaterial({color:0xffffff});

 const a = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const b = new THREE.Mesh(new THREE.BoxGeometry(2,3,120),m);
 const c = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);
 const d = new THREE.Mesh(new THREE.BoxGeometry(200,3,2),m);

 a.position.set(-100,1.5,0);
 b.position.set(100,1.5,0);
 c.position.set(0,1.5,-60);
 d.position.set(0,1.5,60);

 scene.add(a,b,c,d);
}

/////////////////////////////////////////////////////
// 🥅 REAL GOAL NET (FIXED + GUARANTEED VISIBILITY)
/////////////////////////////////////////////////////

function goalNet(){

 const group = new THREE.Group();

 const postMat = new THREE.MeshStandardMaterial({
  color:0xff0000,
  emissive:0x330000
});

 const netMat = new THREE.MeshStandardMaterial({
  color:0xffffff,
  wireframe:true,
  transparent:true,
  opacity:0.7
});

// 🥅 POSTS (PAKSUT)
 const left = new THREE.Mesh(new THREE.BoxGeometry(1,10,1),postMat);
 const right = new THREE.Mesh(new THREE.BoxGeometry(1,10,1),postMat);
 const top = new THREE.Mesh(new THREE.BoxGeometry(14,1,1),postMat);

// 📍 TÄRKEIN FIX: SIIRRETTY LÄHEMMÄS KAMERAA
 const z = -25;

 left.position.set(-6,5,z);
 right.position.set(6,5,z);
 top.position.set(0,10,z);

// 🕸️ BACK NET (SYVYYS)
 const back = new THREE.Mesh(
  new THREE.BoxGeometry(12,8,2),
  netMat
 );

 back.position.set(0,4,z-2);

// 🕸️ SIVUVERKKO
 const sideL = new THREE.Mesh(
  new THREE.BoxGeometry(1,8,2),
  netMat
 );

 const sideR = new THREE.Mesh(
  new THREE.BoxGeometry(1,8,2),
  netMat
 );

 sideL.position.set(-6,4,z-1);
 sideR.position.set(6,4,z-1);

// 🧠 ADD
 group.add(left);
 group.add(right);
 group.add(top);
 group.add(back);
 group.add(sideL);
 group.add(sideR);

 scene.add(group);

 window._goal = group;
}

/////////////////////////////////////////////////////
// 🧍 PLAYERS
/////////////////////////////////////////////////////

function player(color,x,z){

 const g = new THREE.Group();

 const body = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9,1.1,3.5,10),
  new THREE.MeshStandardMaterial({color})
 );

 const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.7,12,12),
  new THREE.MeshStandardMaterial({color:0xffe0bd})
 );

 body.position.y=2;
 head.position.y=4.2;

 g.add(body);
 g.add(head);

 g.position.set(x,0,z);
 scene.add(g);

 return g;
}

function players(){
 user = player(0x0066ff,0,30);
 team = player(0x3399ff,6,30);
 ai1 = player(0xff4444,-5,-20);
 ai2 = player(0xff7777,5,-25);
 goalie = player(0xffffff,0,-27);
}

/////////////////////////////////////////////////////
// PUCK
/////////////////////////////////////////////////////

function puckObj(){

 puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
 );

 puck.rotation.x = Math.PI/2;
 puck.position.set(0,1,0);

 scene.add(puck);
}

/////////////////////////////////////////////////////
// INPUT
/////////////////////////////////////////////////////

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

addEventListener("mousemove",e=>{
 mouse.x = (e.clientX/innerWidth - 0.5)*2;
 mouse.y = (e.clientY/innerHeight - 0.5)*2;
});

/////////////////////////////////////////////////////
// ACTIVE
/////////////////////////////////////////////////////

function active(){
 return controlled==="user"?user:team;
}

/////////////////////////////////////////////////////
// MOVE
/////////////////////////////////////////////////////

function move(){

 let p = active();
 if(!p) return;

 let acc = 0.12;

 if(keys["KeyA"]) velX -= acc;
 if(keys["KeyD"]) velX += acc;
 if(keys["KeyW"]) velZ -= acc;
 if(keys["KeyS"]) velZ += acc;

 velX *= 0.88;
 velZ *= 0.88;

 p.position.x += velX;
 p.position.z += velZ;
}

/////////////////////////////////////////////////////
// PICKUP
/////////////////////////////////////////////////////

function pickup(){

 let p = active();
 if(!p || !puck) return;

 let dx = puck.position.x - p.position.x;
 let dz = puck.position.z - p.position.z;

 if(Math.hypot(dx,dz) < 3.5){

  puck.position.x += (p.position.x - puck.position.x)*0.35;
  puck.position.z += (p.position.z - puck.position.z)*0.35;
  puck.position.y = 1;
 }
}

/////////////////////////////////////////////////////
// SHOOT
/////////////////////////////////////////////////////

function shoot(){

 let p = active();
 if(!p || !puck) return;

 let dx = mouse.x;
 let dz = mouse.y;

 let len = Math.hypot(dx,dz);
 if(len < 0.001){ dx=0; dz=-1; len=1; }

 dx /= len;
 dz /= len;

 vx = dx * 5.5;
 vz = dz * 5.5;
 vy = Math.max(0, -mouse.y * 2.2);
}

addEventListener("mousedown",shoot);

/////////////////////////////////////////////////////
// PASS
/////////////////////////////////////////////////////

function pass(){

 let p = active();
 let t = controlled==="user"?team:user;

 let dx = t.position.x - p.position.x;
 let dz = t.position.z - p.position.z;

 let len = Math.hypot(dx,dz);
 if(len < 0.001) return;

 dx /= len;
 dz /= len;

 vx = dx * 3.8;
 vz = dz * 3.8;
 vy = 0;

 controlled = controlled==="user"?"team":"user";
}

addEventListener("keydown",e=>{
 if(e.code==="Space") pass();
});

/////////////////////////////////////////////////////
// PHYSICS
/////////////////////////////////////////////////////

function physics(){

 if(!puck) return;

 puck.position.x += vx;
 puck.position.z += vz;
 puck.position.y += vy;

 vy -= 0.08;

 if(puck.position.y < 1){
  puck.position.y = 1;
  vy = 0;
 }

 vx *= 0.96;
 vz *= 0.96;
}

/////////////////////////////////////////////////////
// GOAL (SAFE + CORRECT POSITION)
/////////////////////////////////////////////////////

function goal(){

 if(!puck) return;

 // 🔥 TÄRKEÄ: sama z kuin goalNet
 if(puck.position.z < -25 &&
    puck.position.x > -6 &&
    puck.position.x < 6){

  score++;
  document.getElementById("score").innerText = score + " - 0";

  puck.position.set(0,1,0);
  vx = vz = vy = 0;
 }
}

/////////////////////////////////////////////////////
// CAMERA
/////////////////////////////////////////////////////

function cam(){

 let p = active();
 if(!p) return;

 camera.position.x += (p.position.x - camera.position.x)*0.08;
 camera.position.z += (p.position.z + 25 - camera.position.z)*0.08;

 camera.lookAt(p.position.x,0,p.position.z);
}

/////////////////////////////////////////////////////
// LOOP
/////////////////////////////////////////////////////

function loop(){

 requestAnimationFrame(loop);

 move();
 pickup();
 physics();
 goal();
 cam();

 renderer.render(scene,camera);
}

init();
loop();

</script>

</body>
</html>
