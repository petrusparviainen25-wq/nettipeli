<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>3D NHL Mini</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// 🎮 SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x99d9ff);

// 📷 CAMERA
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 40, 60);

// 🖥 RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 🧊 ICE FIELD
const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 60),
  new THREE.MeshBasicMaterial({color:0xe6f7ff})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// 🧍‍♂️ PLAYER
const player = new THREE.Mesh(
  new THREE.BoxGeometry(2,2,2),
  new THREE.MeshBasicMaterial({color:0x0000ff})
);
player.position.y = 1;
player.position.z = 20;
scene.add(player);

// 🏒 PUCK
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,20),
  new THREE.MeshBasicMaterial({color:0x000000})
);
puck.rotation.x = Math.PI/2;
puck.position.set(0,1,0);
scene.add(puck);

// 🥅 GOAL
const goal = new THREE.Mesh(
  new THREE.BoxGeometry(10,5,1),
  new THREE.MeshBasicMaterial({color:0xff0000, wireframe:true})
);
goal.position.set(0,2.5,-25);
scene.add(goal);

// 🤖 GOALIE
const goalie = new THREE.Mesh(
  new THREE.BoxGeometry(4,4,2),
  new THREE.MeshBasicMaterial({color:0x800080})
);
goalie.position.set(0,2,-22);
scene.add(goalie);

// 🎮 INPUT
let keys = {};
document.addEventListener("keydown", e=>keys[e.code]=true);
document.addEventListener("keyup", e=>keys[e.code]=false);

// 🏒 physics
let vx = 0, vz = 0;

function animate(){

  requestAnimationFrame(animate);

  // 🧍‍♂️ player move
  if(keys["KeyA"]) player.position.x -= 0.8;
  if(keys["KeyD"]) player.position.x += 0.8;
  if(keys["KeyW"]) player.position.z -= 0.8;
  if(keys["KeyS"]) player.position.z += 0.8;

  // 🏒 puck follow physics
  puck.position.x += vx;
  puck.position.z += vz;

  vx *= 0.98;
  vz *= 0.98;

  // 🧍‍♂️ puck control
  let dx = puck.position.x - player.position.x;
  let dz = puck.position.z - player.position.z;
  let dist = Math.sqrt(dx*dx + dz*dz);

  if(dist < 4){
    vx += dx * 0.02;
    vz += dz * 0.02;
  }

  // 🎯 shoot
  if(keys["Space"]){
    vx = (puck.position.x - player.position.x) * 0.3;
    vz = -1.5;
  }

  // 🥅 goalie AI
  goalie.position.x += (puck.position.x - goalie.position.x) * 0.05;

  // 🧤 block
  if(puck.position.z < -21 &&
     Math.abs(puck.position.x - goalie.position.x) < 3){
    vz *= -1;
  }

  // 🥅 goal reset
  if(puck.position.z < -25){
    puck.position.set(0,1,0);
    vx = 0; vz = 0;
  }

  renderer.render(scene, camera);
}

animate();

// resize
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
