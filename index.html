<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>NHL BIG UPDATE ENGINE</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  font-family:Arial;
  font-size:18px;
}

#bar {
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:200px;
  height:10px;
  background:#333;
}

#fill {
  height:100%;
  width:0%;
  background:lime;
}
</style>
</head>
<body>

<div id="hud">YOU 0 - 0 AI</div>
<div id="bar"><div id="fill"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

// ================= WORLD =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,30,10);
scene.add(light);

// CAMERA (broadcast)
const camera = new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,28,50);

// RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// ================= ICE =================
const ice = new THREE.Mesh(
  new THREE.PlaneGeometry(150,90),
  new THREE.MeshStandardMaterial({color:0xdff6ff, roughness:0.05})
);
ice.rotation.x = -Math.PI/2;
scene.add(ice);

// ================= GOAL =================
const goal = new THREE.Group();

const mat = new THREE.MeshStandardMaterial({color:0xff0000});

const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.5,6,0.5),mat);
p1.position.set(-6,3,-40);

const p2 = p1.clone();
p2.position.set(6,3,-40);

const bar = new THREE.Mesh(new THREE.BoxGeometry(12,0.5,0.5),mat);
bar.position.set(0,6,-40);

goal.add(p1,p2,bar);
scene.add(goal);

// ================= PLAYER =================
const player = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0x0066ff})
);
player.position.set(0,2,35);
scene.add(player);

// ================= AI =================
const ai = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.2,2,4,8),
  new THREE.MeshStandardMaterial({color:0xff3333})
);
ai.position.set(0,2,-35);
scene.add(ai);

// ================= GOALIE =================
const goalie = new THREE.Mesh(
  new THREE.CapsuleGeometry(1.5,2.5,4,8),
  new THREE.MeshStandardMaterial({color:0xffffff})
);
goalie.position.set(0,2,-38);
scene.add(goalie);

// ================= PUCK =================
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(1,1,0.5,16),
  new THREE.MeshStandardMaterial({color:0x000000})
);
puck.rotation.x=Math.PI/2;
scene.add(puck);

// ================= INPUT =================
let keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

let mouse={x:0,y:0};
addEventListener("mousemove",e=>{
  mouse.x=(e.clientX/innerWidth-0.5)*2;
  mouse.y=(e.clientY/innerHeight-0.5)*2;
});

// ================= STATE =================
let vx=0,vz=0;
let hasPuck=false;

let score=0;

// ================= SHOOT POWER =================
let power=0;
let charging=false;

addEventListener("mousedown",()=>charging=true);
addEventListener("mouseup",()=>{

  if(!hasPuck){ power=0; return; }

  const aimX = player.position.x + mouse.x*25;
  const aimZ = player.position.z + mouse.y*25 - 15;

  vx = (aimX - player.position.x) * (0.2 + power*0.01);
  vz = (aimZ - player.position.z) * (0.2 + power*0.01);

  hasPuck=false;
  power=0;
  charging=false;
});

// ================= AI =================
function aiLogic(){
  ai.position.x += (puck.position.x - ai.position.x)*0.06;
  ai.position.x=Math.max(-60,Math.min(60,ai.position.x));

  ai.position.z += (puck.position.z<-10?0.05:-0.02);
  ai.position.z=Math.max(-40,Math.min(-5,ai.position.z));
}

// ================= CAMERA FOLLOW =================
function updateCamera(){
  camera.position.x += (player.position.x - camera.position.x)*0.05;
  camera.lookAt(player.position.x,0,0);
}

// ================= RESET =================
function reset(){
  puck.position.set(0,1,0);
  vx=0;vz=0;
  hasPuck=false;
  player.position.set(0,2,35);
  ai.position.set(0,2,-35);
  goalie.position.set(0,2,-38);
}

// ================= LOOP =================
function animate(){
  requestAnimationFrame(animate);

  // PLAYER MOVE (smooth)
  if(keys["KeyA"]) player.position.x -= 0.8;
  if(keys["KeyD"]) player.position.x += 0.8;
  if(keys["KeyW"]) player.position.z -= 0.8;
  if(keys["KeyS"]) player.position.z += 0.8;

  // bounds
  player.position.x=Math.max(-60,Math.min(60,player.position.x));
  player.position.z=Math.max(-15,Math.min(60,player.position.z));

  // pickup
  let dx=puck.position.x-player.position.x;
  let dz=puck.position.z-player.position.z;
  let dist=Math.sqrt(dx*dx+dz*dz);

  if(dist<3.5) hasPuck=true;

  // puck control
  if(hasPuck){
    puck.position.x=player.position.x;
    puck.position.z=player.position.z-2;
    puck.position.y=1;
  } else {
    puck.position.x+=vx;
    puck.position.z+=vz;
    vx*=0.96;
    vz*=0.96;
  }

  // AI
  aiLogic();

  // goalie reaction
  goalie.position.x+=(puck.position.x-goalie.position.x)*0.1;
  goalie.position.x=Math.max(-6,Math.min(6,goalie.position.x));

  if(puck.position.z<-37 &&
     Math.abs(puck.position.x-goalie.position.x)<3){
    vx*=-0.5;
  }

  // goal
  if(puck.position.z<-40){
    score++;
    document.getElementById("hud").innerText="GOAL! YOU "+score;
    reset();
  }

  // power bar
  if(charging){
    power=Math.min(100,power+2);
    document.getElementById("fill").style.width=power+"%";
  } else {
    document.getElementById("fill").style.width="0%";
  }

  updateCamera();

  renderer.render(scene,camera);
}

animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
